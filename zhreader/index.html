<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>中文听书</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#F8F1E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="中文听书">
<style>

:root{
  /* 图书阅读风：暖纸色 + 一个棕橙强调色，文字用衬线，界面用系统无衬线 */
  --bg:#F8F1E3; --card:#FFFDF7; --ink:#2A241B; --sub:rgba(42,36,27,.58);
  --accent:#B5651D; --accent2:#9A5A22; --line:rgba(60,50,30,.16); --pop:#F1E8D4; --rec:#C0392B;
  --soft:rgba(181,101,29,.12); --bar:rgba(248,241,227,.78);
  --serif:'New York','Iowan Old Style',Charter,Georgia,'Songti SC','Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue','Noto Sans SC',sans-serif;
  box-sizing:border-box;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140F; --card:#1F1C16; --ink:#EDE6D8; --sub:rgba(237,230,216,.58);
    --accent:#E0954A; --accent2:#E0954A; --line:rgba(237,230,216,.16); --pop:#2A261E; --rec:#E0564A;
    --soft:rgba(224,149,74,.18); --bar:rgba(22,20,15,.78);
  }
}

*{box-sizing:border-box}

html,body{height:100%;margin:0}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}

input,select,textarea{font-size:16px !important}

textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;background:var(--card);color:var(--ink);font-family:var(--serif)}

button{font-family:inherit;border:none;border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;font-weight:500}

button:active{transform:scale(.97)}

button:hover{opacity:.92}

button:focus-visible,summary:focus-visible,.w:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

button.ghost{background:var(--soft);color:var(--accent);border:none}

button.sm{padding:8px 14px;font-size:14px}

button:disabled{background:var(--soft);color:var(--sub);cursor:not-allowed;opacity:.6}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.iconbtn{background:transparent;color:var(--accent);border:none;padding:0 10px;min-width:44px;height:44px;font-size:15px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px}

.iconbtn:hover{background:var(--soft);opacity:1}

.note{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}

.filebtn{position:relative;display:inline-block}

.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

.toastPlus{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:var(--accent2);color:#fff;padding:9px 20px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:70;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:min(90vw,420px);text-align:center;line-height:1.4}

.toastPlus.show{opacity:1;transform:translate(-50%,0)}


#lbov{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--ink);display:none;flex-direction:column;font-family:var(--sans)}

#lbov.show{display:flex}

.lbtop{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bar)}

.lbtop b{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lbbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 24px}

.lbtxt{font-family:var(--serif);line-height:1.95}

.lbp{margin:0 0 1em;text-indent:2em}

.lbs{border-radius:6px;cursor:pointer;transition:background .25s}

.lbs.cur{background:var(--soft);background:color-mix(in srgb,var(--accent) 13%,transparent);-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:3px}

.lbs.wait{color:var(--sub)}

.lbbar{border-top:1px solid var(--line);background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}

.lbbar .row{justify-content:center;gap:8px;margin-top:8px}

.lbitem{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;display:flex;gap:10px;align-items:center}

.lbitem .t{flex:1;min-width:0}
.lbitem .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lbpgr{text-align:center;margin:4px 0 14px}
.lbpgr button{font-size:14px}

.lbtoc{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column}

.lbtoc .lbtl{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 14px 24px}

.lbtoc .it{padding:13px 8px;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:16px;cursor:pointer}

.lbtoc .it span{flex:1;min-width:0}
.lbtoc .it small{color:var(--sub);flex:none}
.lbtoc .it.on{color:var(--accent);font-weight:600}

.lbbody.pg{padding:0;overflow:hidden;position:relative}

.lbclip{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.lbstrip{position:absolute;column-fill:auto;will-change:transform}

.lbstrip .lbtxt{-webkit-text-size-adjust:100%;text-size-adjust:100%;max-width:100%;font-family:var(--serif);line-height:1.56;text-align:justify;text-justify:inter-ideograph;-webkit-hyphens:auto}

.lbstrip .lbp{margin:0}

.lbedge{position:absolute;top:0;bottom:0;width:30px;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,0))}

.lbhome{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3}

.lbfoot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 6px);text-align:center;font-size:12px;color:var(--sub);pointer-events:none;z-index:2}

#lbov.rd .lbtop{position:absolute;top:0;left:0;right:0;z-index:6;background:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-105%);transition:transform .28s ease}

#lbov.rd .lbbar{position:absolute;bottom:0;left:0;right:0;z-index:6;transform:translateY(105%);transition:transform .28s ease;box-shadow:0 -6px 24px rgba(0,0,0,.12)}

#lbov.rd.ui .lbtop,#lbov.rd.ui .lbbar{transform:none}

#lbov.rd .lbbody:not(.pg){padding:calc(env(safe-area-inset-top) + 18px) 20px 44px}

.lbsheet{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}

.lbsheet .in{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}

.lbsheet .g{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}

.lbhead{position:absolute;left:44px;right:44px;top:calc(env(safe-area-inset-top) + 10px);text-align:center;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:2}

#lbov.rd .lbtop{background:none;border:0;box-shadow:none;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 4px) 14px 0;pointer-events:none}

#lbov.rd .lbtop b{display:none}

#lbov.rd .lbtop button{pointer-events:auto;width:44px;height:44px;border-radius:50%;font-size:18px;padding:0}

#lbov.rd .lbbar{background:none;border:0;box-shadow:none;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);pointer-events:none}

#lbov.rd .lbbar .row{gap:10px;margin-top:10px}

#lbov.rd .lbbar .note{display:none}

#lbov.rd .lbbar button,#lbov.rd .lbtop button{pointer-events:auto;background:rgba(246,241,228,.82);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.14)}

#lbov.rd .lbbar button.pri{background:var(--accent);color:#fff;border-color:transparent}

#lbov.sans .lbtxt{font-family:var(--sans);font-weight:300;letter-spacing:.02em}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #lbov.rd{background:#000}:root:not([data-theme="light"]) #lbov.rd .lbtxt{color:rgba(237,230,216,.78)}}

.lbh{margin:18px 0 8px;font-weight:600;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div id="lbov"></div>
<script>

const APP_VERSION = '2026.10.19-1';
const API_BASE = 'https://api.miaomiaosw.com';       // 你的服务器（自然人声由它向微软合成）
/* ---------- 基础：本机数据库、提示、小工具 ---------- */
let _db = null;
function idb() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('zhreader', 1);
    r.onupgradeneeded = () => { const d = r.result; ['meta', 'tts'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess = () => { const d = r.result; d.onclose = () => { _db = null; }; d.onversionchange = () => { try { d.close(); } catch (e) {} _db = null; }; res(d); };
    r.onerror = () => { _db = null; rej(r.error); };
  });
  _db.catch(() => { _db = null; });
  return _db;
}
async function idbRun(store, mode, fn) {
  for (let k = 0; k < 2; k++) {
    let d; try { d = await idb(); } catch (e) { if (k) throw e; await new Promise(r => setTimeout(r, 150)); continue; }
    try { return await new Promise((res, rej) => fn(d.transaction(store, mode), res, rej)); }
    catch (e) { const stale = e && /InvalidState|TransactionInactive|closing|closed|UnknownError/i.test((e.name || '') + ' ' + (e.message || '')); if (!stale || k) throw e; _db = null; try { d.close(); } catch (e2) {} }
  }
}
const idbGet = (store, key) => idbRun(store, 'readonly', (t, res, rej) => { const r = t.objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbPut = (store, val, key) => idbRun(store, 'readwrite', (t, res, rej) => { t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
const idbDel = (store, key) => idbRun(store, 'readwrite', (t, res, rej) => { t.objectStore(store).delete(key); t.oncomplete = res; t.onerror = () => rej(t.error); });
const idbDelPrefix = (store, prefix) => idbRun(store, 'readwrite', (t, res, rej) => { t.objectStore(store).delete(IDBKeyRange.bound(prefix, prefix + '￿')); t.oncomplete = res; t.onerror = () => rej(t.error); });
function toast(msg, ms) {
  const t = document.createElement('div'); t.className = 'toastPlus'; t.textContent = msg; document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show')); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, ms || 850);
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function speakNow(u) {
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => { try { if (speechSynthesis.paused) speechSynthesis.resume(); speechSynthesis.speak(u); } catch (e) {} }, 80); }
    else { if (speechSynthesis.paused) speechSynthesis.resume(); speechSynthesis.speak(u); }
  } catch (e) { alert('当前浏览器不支持朗读。'); }
}
/* JSZip（读 epub / docx 用），第一次要用时才加载 */
let LIBS = null;
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => { el.remove(); rej(new Error('组件加载失败')); }; document.head.appendChild(el); }); }
function loadLibs() { return LIBS || (LIBS = (window.JSZip ? Promise.resolve() : loadScript('../lib/jszip.min.js?v=' + APP_VERSION).catch(() => loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'))).catch(e => { LIBS = null; throw e; })); }
/* ---------- 自然人声的口令：加密后存在本机（密钥不可导出，只在这台设备上能解开） ---------- */
let admTok = '';
const b64 = u8 => btoa(String.fromCharCode(...u8)), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function zhKey() {
  let k = null; try { k = await idbGet('meta', 'k'); } catch (e) {}
  if (!k) { k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); try { await idbPut('meta', k, 'k'); } catch (e) {} }
  return k;
}
async function admLoad() {
  try { const o = JSON.parse(localStorage.getItem('zh_adm') || 'null'); if (!o) return; const k = await idbGet('meta', 'k'); if (!k) return; admTok = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.i) }, k, unb64(o.c))); } catch (e) { admTok = ''; }
}
async function admSave(t) {
  admTok = t; const k = await zhKey(), iv = crypto.getRandomValues(new Uint8Array(12));
  localStorage.setItem('zh_adm', JSON.stringify({ i: b64(iv), c: b64(new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(t)))) }));
}
async function lbUnlock() {
  if (admTok && !confirm('自然人声已经开启。要关闭并清除这台设备上保存的口令吗？')) return;
  if (admTok) { admTok = ''; localStorage.removeItem('zh_adm'); toast('已关闭', 1500); lbOpenShelf(); return; }
  const t = (prompt('输入服务器上设置的 ADMIN_TOKEN（后台口令）。输入一次后会加密保存在这台设备里，以后不用再输。') || '').trim();
  if (!t) return; await admSave(t); lb.natOff = false; toast('已开启自然人声', 2000); if (lb.screen === 'shelf') lbOpenShelf(); else lbBar();
}
async function zhAdmin(path, opt) {
  opt = opt || {}; if (!admTok) return { ok: false, msg: '还没有开启自然人声' };
  try {
    const r = await fetch(API_BASE + path, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + admTok }, opt.headers || {}) }));
    if (r.status === 401) { admTok = ''; localStorage.removeItem('zh_adm'); return { ok: false, msg: '口令不对（已清除，请重新开启）' }; }
    if (r.status === 429) return { ok: false, msg: '429' };
    if (!r.ok) return { ok: false, msg: '服务器返回 ' + r.status };
    return { ok: true, res: r };
  } catch (e) { return { ok: false, msg: '连不上服务器' }; }
}

function readAsArrayBuffer(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsArrayBuffer(file); }); }
function readAsText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsText(file); }); }
function normalizeZipPath(p) {
  const parts = p.split('/'), out = [];
  for (const part of parts) { if (part === '.' || part === '') continue; if (part === '..') out.pop(); else out.push(part); }
  return out.join('/');
}
async function parseEpub(buf) {
  await loadLibs();

  const zip = await JSZip.loadAsync(buf);
  const cf = zip.file('META-INF/container.xml');
  if (!cf) throw new Error('这不是有效的 epub 文件');
  const parser = new DOMParser();
  const cdoc = parser.parseFromString(await cf.async('string'), 'application/xml');
  const opfPath = cdoc.querySelector('rootfile').getAttribute('full-path');
  const opfDir = opfPath.includes('/') ? opfPath.split('/').slice(0, -1).join('/') : '';
  const odoc = parser.parseFromString(await zip.file(opfPath).async('string'), 'application/xml');
  const manifest = {};
  odoc.querySelectorAll('manifest > item').forEach(it => { manifest[it.getAttribute('id')] = it.getAttribute('href'); });
  const blocks = [];
  for (const it of odoc.querySelectorAll('spine > itemref')) {
    const href = manifest[it.getAttribute('idref')]; if (!href) continue;
    const path = opfDir ? opfDir + '/' + href : href;
    const f = zip.file(path) || zip.file(decodeURIComponent(path)); if (!f) continue;
    const doc = parser.parseFromString(await f.async('string'), 'text/html');
    const fileDir = path.includes('/') ? path.split('/').slice(0, -1).join('/') : '';
    const images = [];
    const imgEls = doc.querySelectorAll('img, image');
    for (const img of imgEls) {
      let src = img.getAttribute('src') || img.getAttribute('xlink:href') || img.getAttribute('href');
      if (!src || /^(data:|https?:)/i.test(src)) continue;
      src = decodeURIComponent(src.split('#')[0]);
      const imgPath = normalizeZipPath(src.startsWith('/') ? src.slice(1) : (fileDir ? fileDir + '/' + src : src));
      const imgFile = zip.file(imgPath) || zip.file(decodeURIComponent(imgPath));
      if (!imgFile) continue;
      try {
        const raw = await imgFile.async('blob');
        const ext = (imgPath.split('.').pop() || '').toLowerCase();
        const mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' }[ext] || raw.type || 'image/jpeg';
        if (raw.size > 1500) images.push(new Blob([raw], { type: mime }));
      } catch (e) {}
    }
    const hEl = doc.querySelector('h1,h2,h3');
    const title = hEl ? hEl.textContent.replace(/\s+/g, ' ').trim().slice(0, 60) : '';
    doc.querySelectorAll('p,div,h1,h2,h3,h4,li,br').forEach(el => el.append(' \n'));
    const text = (doc.body ? doc.body.textContent : '').trim();
    if (text || images.length) blocks.push({ text, images, title });
  }
  return blocks;
}

/* ---------- 更多格式：Markdown / Word(.docx) / Kindle(.mobi .azw3 .azw) ---------- */
function mdToText(s) {
  s = s.replace(/\r/g, '').replace(/<style[\s\S]*?<\/style>/gi, '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<!--[\s\S]*?-->/g, '')
    .replace(/^(\s{0,3}#{1,6}\s+)(.*)$/gm, (all, hs, body) => {            // 中英双语标题（如“第一章 · Chapter One”“Before Breakfast（早饭之前）”）拆成“英文一行 + 中文一行”，各自成段，才能一对一配上，不会和下一段错位
      const zhP = (body.match(/[\u3400-\u9fff][\u3400-\u9fff\s·•，。、：:（）()0-9]*/g) || []).join(' ').replace(/[（）()·•]/g, ' ').replace(/\s+/g, ' ').trim();
      const enP = body.replace(/[（(][^()（）A-Za-z]*[\u3400-\u9fff][^()（）A-Za-z]*[)）]/g, ' ').replace(/[\u3400-\u9fff]+/g, ' ').replace(/[·•|]/g, ' ').replace(/\s+/g, ' ').trim();
      return zhP && /[A-Za-z]{2}/.test(enP) ? enP + '\n\n' + zhP : all;
    })
  return s.replace(/^```.*$/gm, '').replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^\s{0,3}#{1,6}\s+/gm, '').replace(/^\s{0,3}>\s?/gm, '').replace(/^\s*([-*+]|\d+\.)\s+/gm, '')
    .replace(/^\s*([-*_]\s*){3,}$/gm, '').replace(/(\*\*|__)(.+?)\1/g, '$2').replace(/\*(.+?)\*/g, '$1')
    .replace(/(^|\W)_(.+?)_(?=\W|$)/g, '$1$2').replace(/`([^`]+)`/g, '$1').replace(/<[^>]+>/g, '');
}
async function parseDocx(buf) {
  await loadLibs();

  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml');
  if (!f) throw new Error('这不是有效的 .docx 文件（旧版 .doc 请先在 Word 里另存为 .docx）');
  const doc = new DOMParser().parseFromString(await f.async('string'), 'application/xml');
  const out = [];
  for (const p of doc.getElementsByTagName('w:p')) {
    let t = '';
    for (const n of p.getElementsByTagName('*')) {
      if (n.nodeName === 'w:t') t += n.textContent;
      else if (n.nodeName === 'w:tab') t += ' ';
      else if (n.nodeName === 'w:br' || n.nodeName === 'w:cr') t += '\n';
    }
    t = t.trim(); if (t) out.push(t);
  }
  return out.join('\n\n');
}
function palmDecompress(b) {
  const out = []; let i = 0; const n = b.length;
  while (i < n) {
    const c = b[i++];
    if (c === 0 || (c >= 9 && c <= 0x7f)) out.push(c);
    else if (c >= 1 && c <= 8) { for (let k = 0; k < c && i < n; k++) out.push(b[i++]); }
    else if (c >= 0xc0) { out.push(32, c ^ 0x80); }
    else { const v = (((c << 8) | b[i++]) & 0x3fff), dist = v >> 3, len = (v & 7) + 3; for (let k = 0; k < len; k++) out.push(out[out.length - dist]); }
  }
  return Uint8Array.from(out);
