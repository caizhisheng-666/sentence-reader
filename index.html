<style>
:root{
  /* 图书阅读风：暖纸色 + 一个棕橙强调色，文字用衬线，界面用系统无衬线 */
  --bg:#F8F1E3; --card:#FFFDF7; --ink:#2A241B; --sub:rgba(42,36,27,.58);
  --accent:#B5651D; --accent2:#9A5A22; --line:rgba(60,50,30,.16); --pop:#F1E8D4; --rec:#C0392B;
  --soft:rgba(181,101,29,.12); --bar:rgba(248,241,227,.78);
  --serif:'New York','Iowan Old Style',Charter,Georgia,'Songti SC','Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue','Noto Sans SC',sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140F; --card:#1F1C16; --ink:#EDE6D8; --sub:rgba(237,230,216,.58);
    --accent:#E0954A; --accent2:#E0954A; --line:rgba(237,230,216,.16); --pop:#2A261E; --rec:#E0564A;

}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
#app{max-width:680px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top,0px)) 20px calc(104px + env(safe-area-inset-bottom,0px));}
h1{font-size:17px;letter-spacing:.5px;margin:0;font-weight:600}
input,select,textarea{font-size:16px !important}
.sub{color:var(--sub);font-size:13px}
.card{background:transparent;border:none;border-radius:0;padding:0 2px;margin-bottom:16px}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;background:var(--card);color:var(--ink);font-family:var(--serif)}
button{font-family:inherit;border:none;border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;font-weight:500}

button:disabled{background:var(--soft);color:var(--sub);cursor:not-allowed;opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

details.grp > summary{cursor:pointer;font-weight:600;padding:8px 0}

.toastPlus.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
'use strict';
const APP_VERSION = '2026.10.14-71';        // 每次更新时改一下，方便定位问题
const FEEDBACK_URL = 'https://v.wjx.cn/vm/O685vXZ.aspx';                    // 建好反馈问卷后，把网址填在这里，“帮助与反馈”里就会出现“打开反馈问卷”按钮
let state = null, dictInfo = null, curTokens = [], curTokenPos = [], curWord = '', curWordZh = '', gramOpen = true;
let analysisCache = { idx: -1, res: null };
let rec = { mr: null, on: false, start: 0, timer: null };
let recView = { key: '', urls: [] };
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = window.__pdfLocal ? './lib/pdf.worker.min.js' : 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));

/* ---------- IndexedDB：离线大词典 + 录音 ---------- */
let _db = null;
function idb() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('sentence-reader', 6);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('dict')) d.createObjectStore('dict', { keyPath: 'w' });
      if (!d.objectStoreNames.contains('recs')) d.createObjectStore('recs');
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('vocab')) d.createObjectStore('vocab', { keyPath: 'word' });
      if (!d.objectStoreNames.contains('images')) d.createObjectStore('images');
      if (!d.objectStoreNames.contains('tts')) d.createObjectStore('tts');
      if (!d.objectStoreNames.contains('vpack')) d.createObjectStore('vpack');
      if (!d.objectStoreNames.contains('books')) d.createObjectStore('books');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _db;
}
async function idbGet(store, key) {
  const d = await idb();
  return new Promise((res, rej) => { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGetAll(store) {
  const d = await idb();
  return new Promise((res, rej) => { const r = d.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
}
async function idbPut(store, val, key) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); if (key === undefined) t.objectStore(store).put(val); else t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbPutMany(store, arr) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); const s = t.objectStore(store); arr.forEach(v => s.put(v)); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
}
async function idbClear(store) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).clear(); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbDelPrefix(store, prefix) {          // 删除所有以 prefix 开头的 key（按书删除插图、录音）
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).delete(IDBKeyRange.bound(prefix, prefix + '\uffff')); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
}
async function idbDel(store, key) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).delete(key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}

/* ---------- 启动与保存 ---------- */
function bookShortTitle(sentences) { const t = String((sentences && sentences[0]) || '').replace(/\s+/g, ' ').trim(); return t.length > 26 ? t.slice(0, 26) + '…' : (t || '未命名的书'); }
async function boot() {
  // 旧版本只存一本书（localStorage 里的 sr_state）：第一次打开新版本时，自动搬进书架
  try {
    const raw = localStorage.getItem('sr_state');
    if (raw) {
      const old = JSON.parse(raw);
      if (old && Array.isArray(old.sentences) && old.sentences.length) {
        if (!old.bookId) old.bookId = 'b' + (old.startDate || Date.now());
        old.prog = old.prog || {}; old.cache = old.cache || {}; delete old.wordCache;
        old.title = old.title || bookShortTitle(old.sentences);
        await idbPut('books', old, old.bookId);
        const l = shelfGet();
        if (!l.some(x => x.id === old.bookId)) { l.unshift({ id: old.bookId, title: old.title, addedAt: old.startDate || Date.now(), lastAt: Date.now(), total: old.sentences.length, idx: old.idx || 0 }); shelfSet(l); }
      }
      localStorage.removeItem('sr_state');
    }
  } catch (e) {}
  try { dictInfo = (await idbGet('meta', 'dictInfo')) || null; } catch (e) {}
  vpInit();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  render();                                                    // 打开软件先进入书架
  loadVoices().then(refreshVoiceSelect).catch(() => {});      // 提前把声音列表加载好，第一次点“听原音”才有声音
  if (!dictInfo || !dictInfo.count) autoImportDict();
}
window.addEventListener('online', () => { if (state) loadCurrent(); });
window.addEventListener('offline', () => render());
window.addEventListener('pagehide', () => { flushState(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushState(); });
boot();

/* ---------- 书架：每本书存在 IndexedDB 里，书架目录（书名、进度）存在 localStorage ---------- */
function shelfGet() { try { return JSON.parse(localStorage.getItem('sr_shelf') || '[]') || []; } catch (e) { return []; } }
function shelfSet(l) { try { localStorage.setItem('sr_shelf', JSON.stringify(l)); } catch (e) {} }
let saveTimer = null;
function saveState() {
  if (!state) return;
  const l = shelfGet(), e = l.find(x => x.id === state.bookId);
  if (e) { e.idx = state.idx; e.lastAt = Date.now(); e.total = state.sentences.length; shelfSet(l); }

/* ---------- 整句翻译（需联网，失败不影响学习） ---------- */
let lastTranslateAt = 0, googleBadUntil = 0;
async function throttleGap() {
  const gap = 700, wait = lastTranslateAt + gap - Date.now();
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastTranslateAt = Date.now();
}
async function fetchViaGoogle(q) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(q);
    const resp = await fetch(url, { signal: ctrl.signal });
    if (!resp.ok) { const err = new Error('google-' + resp.status); err.code = resp.status; throw err; }
    const data = await resp.json();
    const t = (data && data[0] || []).map(seg => seg && seg[0]).join('');
    if (!t) throw new Error('google-empty');
    return t;
  } finally { clearTimeout(timer); }
}
async function fetchViaMyMemory(q) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  let resp;
  try {
    resp = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=en|zh-CN', { signal: ctrl.signal });
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? '网络请求超时' : '网络请求失败');
  } finally { clearTimeout(timer); }
  if (resp.status === 429) { const err = new Error('翻译服务返回 429'); err.code = 429; throw err; }
  if (!resp.ok) throw new Error('翻译服务返回 ' + resp.status);
  const data = await resp.json();
  const t = data && data.responseData && data.responseData.translatedText;
  if (!t) throw new Error('没有返回翻译结果');
  if (/MYMEMORY WARNING|QUOTA/i.test(t)) throw new Error('今天的免费翻译额度已用完，明天会恢复');
  return t;
}
const PROXY_URL = 'https://api.miaomiaosw.com/translate';   // 自己的翻译中转（火山引擎），国内可直连
let proxyBadUntil = 0;
async function fetchViaProxy(q) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const resp = await fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: q }), signal: ctrl.signal });
    let data = {}; try { data = await resp.json(); } catch (e) {}
    if (!resp.ok) { const err = new Error('proxy-' + resp.status); err.code = data.error || resp.status; throw err; }
    if (!data.translation) throw new Error('proxy-empty');
    return data.translation;
  } finally { clearTimeout(timer); }
}
// 整页批量翻译算“付费功能”：未解锁时只用免费接口，不占自建翻译服务的额度。解锁机制（激活码）之后接入。
function isPro() { try { return localStorage.getItem('sr_pro') === '1'; } catch (e) { return false; } }
async function translateText(text, opts) {
  const q = text.slice(0, 480);
  await throttleGap();
  // 首选：自己的中转（稳定、国内可用）；失败再退回下面的免费源
  if (Date.now() > proxyBadUntil && (!(opts && opts.bulk) || isPro())) {
    try { return await fetchViaProxy(q); }
    catch (e) {
      if (e.code === 'quota') proxyBadUntil = Date.now() + 6 * 3600 * 1000;
      else if (e.code === 'daily') proxyBadUntil = Date.now() + 3600 * 1000;      // 今天自己的份额用完       // 本月额度用完，先不再请求
      else if (e.code !== 'rate-limited') proxyBadUntil = Date.now() + 2 * 60 * 1000; // 其他失败，2 分钟后再试
    }
  }
  // 同时请求 Google 和 MyMemory，谁先成功用谁（Google 在国内常被墙，不再傻等它超时）
  const delays = [0, 1500, 3500];
  const myMem = (async () => {
    let lastErr;
    for (let i = 0; i < delays.length; i++) {
      if (delays[i]) { await new Promise(r => setTimeout(r, delays[i])); await throttleGap(); }
      try { return await fetchViaMyMemory(q); }
      catch (e) { lastErr = e; if (e.code !== 429) throw e; }
    }
    throw lastErr;
  })();
  const jobs = [myMem];
  if (Date.now() > googleBadUntil) {
    jobs.push(fetchViaGoogle(q).catch(e => { googleBadUntil = Date.now() + 10 * 60 * 1000; /* 失败后 10 分钟内不再请求它 */ throw e; }));
  }
  try { return await Promise.any(jobs); }
  catch (agg) {
    const errs = (agg && agg.errors) || [];
    throw errs[0] || new Error('两个免费翻译源暂时都请求失败，请稍等一会儿再点重试');
  }
}


/* ---------- 文本处理 ---------- */
/* ---------- 换行处理：哪些换行是“断句”，哪些只是排版折行 ---------- */
// 古腾堡等 txt 每行只有 70 字左右就硬折行（折行处不是句子边界）；绘本、epub 则是一行/一段一句。
// 规则：①空行前一段没有句末标点 → 是标题/署名，断开；②折行文本里，只有“很短、没标点、下一行大写开头”的行才断开；
//       ③非折行文本里，没标点、下一行大写开头的行都断开。其余换行当空格。
const BRK = '\uE000';
const LINE_END_RE = /[.!?…:;]["'”’)\]]*$/;
function markBreaks(text) {
  text = String(text == null ? '' : text).replace(/\r\n?/g, '\n');
  if (text.indexOf('\n') < 0) return text.replace(/\s+/g, ' ');
  const raw = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim());
  const lens = raw.filter(Boolean).map(l => l.length).sort((a, b) => a - b);
  if (!lens.length) return '';
  const p90 = lens[Math.min(lens.length - 1, Math.floor(lens.length * 0.9))];
  const nearMax = lens.filter(n => n >= p90 * 0.85).length / lens.length;
  const hardWrapped = p90 >= 55 && nearMax >= 0.4;
  const shortLimit = Math.min(45, Math.round(p90 * 0.6));
  const out = []; let pendingBlank = false;
  for (let i = 0; i < raw.length; i++) {
    const line = raw[i];
    if (!line) { pendingBlank = true; continue; }
    if (out.length) {
      const prev = out[out.length - 1].line;
      const noEnd = !LINE_END_RE.test(prev);
      const nextUpper = /^["'“‘(\[]*[A-Z0-9]/.test(line);
      let brk = false;
      if (pendingBlank) brk = noEnd;
      else if (noEnd && nextUpper) brk = hardWrapped ? prev.length < shortLimit : true;
      out[out.length - 1].brk = brk;
    }
    out.push({ line, brk: false }); pendingBlank = false;
  }
  return out.map((o, i) => o.line + (i < out.length - 1 ? (o.brk ? ' ' + BRK + ' ' : ' ') : '')).join('').replace(/\s+/g, ' ');
}

  // ③每一段中文都当作分隔符，这样英文段落之间即使没有句末标点，也不会被粘成一整句。
  text = text.replace(/[（(][^()（）A-Za-z]*[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff][^()（）A-Za-z]*[)）]/g, ' ');

  text = text.replace(/\b((?:[A-Z]\.){1,3}[A-Z])\.(?=\s+[A-Z])/g, (m, w) => w.replace(/\./g, '\u2024') + '.');   // 缩写后面是大写词：只保护中间的点
  text = text.replace(/([a-z][.!?])(?=[“‘])/g, '$1 '); // 句号后面紧跟着左引号，补个空格才能断句

    if (m.index > last) raw.push({ lang: 'en', text: t.slice(last, m.index) });
    raw.push({ lang: 'zh', text: m[0] });

function stripGutenberg(text) {

/* ---------- 词序对比打分（听写 / 跟读打分共用） ---------- */

function lcsMatch(target, user) {
  const n = target.length, m = user.length;

  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    dp[i][j] = target[i - 1] === user[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  }
  let i = n, j = m; const matchedTarget = new Set(), matchedUser = new Set();
  while (i > 0 && j > 0) {

  const userHtml = userDisplay.map((w, idx) => '<span style="color:' + (r.matchedUser.has(idx) ? 'var(--accent2)' : 'var(--rec)') + (r.matchedUser.has(idx) ? '' : ';text-decoration:line-through') + '">' + esc(w) + '</span>').join(' ') || '<span class="sub">（没有识别到内容）</span>';

  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function azStoreKey(keyStr) {               // 用已解锁的密钥，把 Key 加密后存起来（每次用新的随机数，密文都不一样）
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, azCryptoKey, new TextEncoder().encode(keyStr)));
  localStorage.setItem('sr_az_enc', JSON.stringify({ v: 1, s: u8b64(azSalt), i: u8b64(iv), c: u8b64(ct) }));
  azKeyMem = keyStr;
}
async function azSetupPass(pass, keyStr) {        // 第一次设置：口令 + Key
  azSalt = crypto.getRandomValues(new Uint8Array(16));
  azCryptoKey = await azDerive(pass, azSalt);
  await azStoreKey(keyStr);
  localStorage.setItem('sr_az_dev', '1');

async function azUnlockWith(pass) {

  if (!o) return false;

    const salt = b64u8(o.s), ck = await azDerive(pass, salt);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u8(o.i) }, ck, b64u8(o.c));

    return true;
  } catch (e) { return false; }                   // 口令不对，解密会失败
}

async function toggleRecord() {
  if (rec.on) { if (rec.mr && rec.mr.state === 'recording') rec.mr.stop(); return; }
  if (recBusy) return;                                   // 正在等麦克风权限时，防止连点启动出两个录音
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    alert('这个浏览器不支持录音。请用最新版 Chrome、Edge 或 Safari 打开。'); return;
  }
  recBusy = true;
  try {
    stopSpeech();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { alert('没有拿到麦克风权限。请在浏览器地址栏左侧的权限设置里允许使用麦克风，然后再试。'); return; }
    if (!state) { stream.getTracks().forEach(t => t.stop()); return; }
    const chunks = [];
    let mr;
    try { mr = new MediaRecorder(stream); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); alert('这个浏览器无法开始录音：' + e.message); return; }
    const idxAtStart = state.idx, keyAtStart = recKey(), start = Date.now();
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onerror = () => { try { if (mr.state !== 'inactive') mr.stop(); } catch (e) {} };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(rec.timer); rec.on = false;
      const dur = (Date.now() - start) / 1000;
      const blob = new Blob(chunks, { type: mr.mimeType || chunks[0]?.type || 'audio/webm' });
      let msg = '';
      if (blob.size > 0 && dur >= 0.8) {
        try {
          const arr = (await idbGet('recs', keyAtStart)) || [];
          arr.unshift({ blob, t: Date.now(), dur });
          await idbPut('recs', arr.slice(0, 3), keyAtStart);
        } catch (e) { msg = '录音保存失败（浏览器存储不可用或空间已满）。'; }
      } else if (blob.size === 0) { msg = '没有录到声音，请检查麦克风后再试。'; }
      else { msg = '录音太短（不到 1 秒），没有保存。'; }
      if (state && state.idx === idxAtStart) await loadRecs(); else render();
      if (msg) toast(msg, 3000);
    };
    try { mr.start(); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); alert('开始录音失败：' + e.message); return; }
    rec = { mr, on: true, start, timer: setInterval(() => { const el = document.getElementById('recTime'); if (el) el.textContent = ((Date.now() - start) / 1000).toFixed(1) + ' 秒'; }, 200) };
    render();
  } finally { recBusy = false; }
}

async function dictLookup(w) {
  if (!dictInfo || !dictInfo.count) return null;
  try { return (await idbGet('dict', w)) || (await idbGet('dict', '^' + w)) || null; } catch (e) { return null; }

async function lookupWord(raw) {
  const cands = EG.lemmaCandidates(raw), results = [], seen = new Set(), extra = [];
  const tryOne = async c => {
    if (seen.has(c.w) || results.length >= 3) return;
    const e = await dictLookup(c.w);
    if (e) {
      seen.add(c.w);
      results.push({ head: e.w.replace(/^\^/, ''), p: e.p, t: e.t, d: e.d, note: c.note, src: '离线大词典' });
      const m = (e.x || '').match(/(?:^|\/)0:([^\/]+)/);
      if (m && m[1].toLowerCase() !== c.w) extra.push({ w: m[1].toLowerCase(), note: c.w + ' 的原形是 ' + m[1] });
      return;
    }
    const b = BASIC_DICT[c.w];
    if (b) { seen.add(c.w); results.push({ head: c.w, t: b, note: c.note, src: '内置词典' }); }
  };
  for (const c of cands) { if (c.r && results.length) continue; await tryOne(c); }
  for (const c of extra) await tryOne(c);
  if (!results.length && navigator.onLine && cands.length) {
    try { results.push({ head: cands[0].w, t: await translateText(cands[0].w), src: '在线翻译' }); } catch (e) {}
  }
  return results;
}
function positionWordPop(rect) {
  const pop = document.getElementById('wordpop');
  pop.hidden = false; pop.style.visibility = 'hidden';
  pop.className = 'wordpop';
  const vw = window.innerWidth, vh = window.innerHeight;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = rect.left + rect.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, vw - pw - 8));
  const spaceBelow = vh - rect.bottom, spaceAbove = rect.top;
  let top, cls;
  if (spaceBelow >= ph + 14 || spaceBelow >= spaceAbove) { top = rect.bottom + 12; cls = 'below'; }
  else { top = rect.top - ph - 12; cls = 'above'; }
  top = Math.max(8, Math.min(top, vh - ph - 8));
  pop.className = 'wordpop ' + cls;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  const arrowLeft = Math.max(14, Math.min(rect.left + rect.width / 2 - left - 6, pw - 26));
  pop.querySelector('.wp-arrow').style.left = arrowLeft + 'px';
  pop.style.visibility = 'visible';
}

// ECDICT 完整版有 76 万词条，其中大量是生僻词和专有名词。只保留常用词（词频前 6 万，或带考试/柯林斯/牛津标记的），体积小很多。
function ecKeep(r) {
  const frq = parseInt(r.frq, 10) || 0, bnc = parseInt(r.bnc, 10) || 0;
  const rank = Math.min(frq || 1e9, bnc || 1e9);
  const flagged = (parseInt(r.collins, 10) || 0) > 0 || String(r.oxford || '').trim() === '1' || String(r.tag || '').trim() !== '';
  return rank <= 60000 || flagged;
}
async function parseDictBlob(blob, name, onProgress) {
  if (!window.Papa) throw new Error('导入组件没有加载成功，请联网刷新页面后再试');
  const head = await blob.slice(0, 4096).text();
  const firstLine = head.split(/\r?\n/)[0].toLowerCase();
  const isEcdict = firstLine.includes('word') && firstLine.includes('translation');
  const isTsv = !isEcdict && firstLine.includes('\t');
  await idbClear('dict');
  await idbPut('meta', null, 'dictInfo');
  dictInfo = null;
  let count = 0, pending = Promise.resolve();
  await new Promise((resolve, reject) => {
    Papa.parse(blob, {
      header: isEcdict,
      delimiter: isTsv ? '\t' : '',
      skipEmptyLines: true,
      chunkSize: 2 * 1024 * 1024,
      chunk: (results, parser) => {
        parser.pause();
        const items = [];
        for (const r of results.data) {
          let w, t, p = '', d = '', x = '';
          if (isEcdict) { if (!ecKeep(r)) continue; w = r.word; t = r.translation; p = r.phonetic || ''; d = r.definition || ''; x = r.exchange || ''; }
          else { w = r[0]; t = (r.slice(1) || []).join(' '); }
          if (!w) continue;
          w = String(w).trim();
          if (!w || w.indexOf(' ') >= 0 || w.length > 40) continue;
          t = String(t || '').replace(/\\n/g, '\n').trim();
          d = String(d || '').replace(/\\n/g, '\n').trim();
          if (!t && !d) continue;
          const low = w.toLowerCase();
          items.push({ w: (w === low ? low : '^' + low), t, p, d: d.slice(0, 400), x });
        }
        count += items.length;
        pending = idbPutMany('dict', items).then(() => {
          if (onProgress) onProgress(count, 100 * (results.meta.cursor || 0) / blob.size);
          parser.resume();
        }).catch(err => { parser.abort(); reject(err); });
      },
      complete: () => { pending.then(resolve, reject); },
      error: err => reject(err)
    });
  });
  if (!count) throw new Error('没有读到任何词条，文件格式可能不对');
  dictInfo = { count, name, at: Date.now() };
  await idbPut('meta', dictInfo, 'dictInfo');
  return count;
}

const SLIM_DICT_URLS = ['./dict.tsv.gz', './dict.tsv'];
let autoDictRunning = false;
function setAutoMsg(m) { try { localStorage.setItem('sr_autodict_msg', m || ''); } catch (e) {} }
function getAutoMsg() { return localStorage.getItem('sr_autodict_msg') || ''; }
async function readMaybeGzip(resp) {
  const buf = await resp.arrayBuffer();
  const u8 = new Uint8Array(buf);
  if (u8.length > 2 && u8[0] === 0x1f && u8[1] === 0x8b) {
    if (typeof DecompressionStream === 'undefined') throw new Error('浏览器版本太旧，不支持解压词典文件');
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  return new TextDecoder('utf-8').decode(u8);
}
async function importSlimText(text, name) {
  await idbClear('dict'); await idbPut('meta', null, 'dictInfo'); dictInfo = null;
  let count = 0, batch = [];
  for (const line of text.split('\n')) {
    if (!line) continue;
    const f = line.split('\t');
    if (f.length < 3 || !f[0]) continue;
    batch.push({ w: f[0], p: f[1] || '', t: (f[2] || '').replace(/\\n/g, '\n'), d: '', x: f[3] || '' });
    if (batch.length >= 5000) { await idbPutMany('dict', batch); count += batch.length; batch = []; }
  }
  if (batch.length) { await idbPutMany('dict', batch); count += batch.length; }
  if (!count) throw new Error('词典文件是空的或格式不对');
  dictInfo = { count, name, at: Date.now() };
  await idbPut('meta', dictInfo, 'dictInfo');
  return count;
}
async function autoImportDict(force) {
  if (autoDictRunning) return;
  if (!force && dictInfo && dictInfo.count) return;
  autoDictRunning = true;
  try {
    if (!navigator.onLine) { setAutoMsg('当前没有网络，联网后再打开会自动下载。'); return; }
    let resp = null;
    for (const u of SLIM_DICT_URLS) {
      let r;
      try { r = await fetch(u, { cache: 'no-cache' }); } catch (e) { setAutoMsg('网络请求失败，请检查网络后点“重试自动下载”。'); return; }
      if (r.ok) { resp = r; break; }
    }
    if (!resp) { setAutoMsg('这个网站上还没有放词典文件（dict.tsv.gz）。放好之后重新打开就会自动下载，做法见下面的说明。'); return; }
    setAutoMsg('正在下载并导入…');
    toast('正在后台下载离线词典，完成前可先用基础词典查词…', 3800);
    const text = await readMaybeGzip(resp);
    if (/^\s*<(!doctype|html)/i.test(text.slice(0, 100))) { setAutoMsg('这个网站上还没有放词典文件（dict.tsv.gz）。'); return; }
    const count = await importSlimText(text, '本站词典 dict.tsv.gz');
    setAutoMsg('');

  } catch (e) {
    setAutoMsg('自动下载失败：' + (e && e.message ? e.message : '未知错误'));
  } finally { autoDictRunning = false; }
}
async function exportSlimDict() {
  setDictStatus('正在整理精简词典…', 0);
  try {
    const all = await idbGetAll('dict');
    const lines = [];
    for (const e of all) {
      if (!e.t) continue;
      const m = (e.x || '').match(/(?:^|\/)0:([^\/]+)/);
      const t = String(e.t).slice(0, 110).replace(/\r/g, '').replace(/\t/g, ' ').replace(/\n/g, '\\n');
      lines.push([e.w, String(e.p || '').replace(/\t/g, ' '), t, m ? '0:' + m[1] : ''].join('\t'));
    }
    if (!lines.length) { setDictStatus('还没有可导出的词典，请先导入 ecdict.csv。'); return; }
    const raw = new Blob([lines.join('\n')], { type: 'text/tab-separated-values' });
    let out = raw, name = 'dict.tsv';
    if (typeof CompressionStream !== 'undefined') { out = await new Response(raw.stream().pipeThrough(new CompressionStream('gzip'))).blob(); name = 'dict.tsv.gz'; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    const mb = out.size / 1048576;
    setDictStatus('已生成 ' + name + '（' + lines.length.toLocaleString() + ' 个词，' + mb.toFixed(1) + ' MB）。' + (mb > 24 ? ' ⚠ 超过 25MB，GitHub 网页上传会失败，请告诉我再缩小。' : ' 请把它上传到 GitHub 仓库根目录。'), 100);
  } catch (err) {
    setDictStatus('导出失败：' + (err && err.message ? err.message : '未知错误'));
  }
}

/* ---------- 文件导入 ---------- */
function readAsArrayBuffer(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsArrayBuffer(file); }); }
function readAsText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsText(file); }); }
function normalizeZipPath(p) {
  const parts = p.split('/'), out = [];
  for (const part of parts) { if (part === '.' || part === '') continue; if (part === '..') out.pop(); else out.push(part); }
  return out.join('/');
}
async function parseEpub(buf) {
  const zip = await JSZip.loadAsync(buf);
  const cf = zip.file('META-INF/container.xml');
  if (!cf) throw new Error('这不是有效的 epub 文件');
  const parser = new DOMParser();
  const cdoc = parser.parseFromString(await cf.async('string'), 'application/xml');
  const opfPath = cdoc.querySelector('rootfile').getAttribute('full-path');
  const opfDir = opfPath.includes('/') ? opfPath.split('/').slice(0, -1).join('/') : '';
  const odoc = parser.parseFromString(await zip.file(opfPath).async('string'), 'application/xml');
  const manifest = {};
  odoc.querySelectorAll('manifest > item').forEach(it => { manifest[it.getAttribute('id')] = it.getAttribute('href'); });
  const blocks = [];
  for (const it of odoc.querySelectorAll('spine > itemref')) {
    const href = manifest[it.getAttribute('idref')]; if (!href) continue;
    const path = opfDir ? opfDir + '/' + href : href;
    const f = zip.file(path) || zip.file(decodeURIComponent(path)); if (!f) continue;
    const doc = parser.parseFromString(await f.async('string'), 'text/html');
    const fileDir = path.includes('/') ? path.split('/').slice(0, -1).join('/') : '';
    const images = [];
    const imgEls = doc.querySelectorAll('img, image');
    for (const img of imgEls) {
      let src = img.getAttribute('src') || img.getAttribute('xlink:href') || img.getAttribute('href');
      if (!src || /^(data:|https?:)/i.test(src)) continue;
      src = decodeURIComponent(src.split('#')[0]);
      const imgPath = normalizeZipPath(src.startsWith('/') ? src.slice(1) : (fileDir ? fileDir + '/' + src : src));
      const imgFile = zip.file(imgPath) || zip.file(decodeURIComponent(imgPath));
      if (!imgFile) continue;
      try {
        const raw = await imgFile.async('blob');
        const ext = (imgPath.split('.').pop() || '').toLowerCase();
        const mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' }[ext] || raw.type || 'image/jpeg';
        if (raw.size > 1500) images.push(new Blob([raw], { type: mime }));
      } catch (e) {}
    }
    const hEl = doc.querySelector('h1,h2,h3');
    const title = hEl ? hEl.textContent.replace(/\s+/g, ' ').trim().slice(0, 60) : '';
    doc.querySelectorAll('p,div,h1,h2,h3,h4,li,br').forEach(el => el.append(' \n'));
    const text = (doc.body ? doc.body.textContent : '').trim();
    if (text || images.length) blocks.push({ text, images, title });
  }
  return blocks;
}

/* ---------- 更多格式：Markdown / Word(.docx) / Kindle(.mobi .azw3 .azw) ---------- */
function mdToText(s) {
  return s.replace(/\r/g, '').replace(/^```.*$/gm, '').replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^\s{0,3}#{1,6}\s+/gm, '').replace(/^\s{0,3}>\s?/gm, '').replace(/^\s*([-*+]|\d+\.)\s+/gm, '')
    .replace(/^\s*([-*_]\s*){3,}$/gm, '').replace(/(\*\*|__)(.+?)\1/g, '$2').replace(/\*(.+?)\*/g, '$1')
    .replace(/(^|\W)_(.+?)_(?=\W|$)/g, '$1$2').replace(/`([^`]+)`/g, '$1').replace(/<[^>]+>/g, '');
}
async function parseDocx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml');
  if (!f) throw new Error('这不是有效的 .docx 文件（旧版 .doc 请先在 Word 里另存为 .docx）');
  const doc = new DOMParser().parseFromString(await f.async('string'), 'application/xml');
  const out = [];
  for (const p of doc.getElementsByTagName('w:p')) {
    let t = '';
    for (const n of p.getElementsByTagName('*')) {
      if (n.nodeName === 'w:t') t += n.textContent;
      else if (n.nodeName === 'w:tab') t += ' ';
      else if (n.nodeName === 'w:br' || n.nodeName === 'w:cr') t += '\n';
    }
    t = t.trim(); if (t) out.push(t);
  }
  return out.join('\n\n');
}
function palmDecompress(b) {
  const out = []; let i = 0; const n = b.length;
  while (i < n) {
    const c = b[i++];
    if (c === 0 || (c >= 9 && c <= 0x7f)) out.push(c);
    else if (c >= 1 && c <= 8) { for (let k = 0; k < c && i < n; k++) out.push(b[i++]); }
    else if (c >= 0xc0) { out.push(32, c ^ 0x80); }
    else { const v = (((c << 8) | b[i++]) & 0x3fff), dist = v >> 3, len = (v & 7) + 3; for (let k = 0; k < len; k++) out.push(out[out.length - dist]); }

}
function mobiTrailingSize(rec, flags) {
  const entry = size => { let bitpos = 0, result = 0; if (size <= 0) return 0; for (;;) { const v = rec[size - 1]; result |= (v & 0x7f) << bitpos; bitpos += 7; size--; if ((v & 0x80) || bitpos >= 28 || size === 0) return result; } };
  let num = 0, tf = flags >> 1;
  while (tf) { if (tf & 1) num += entry(rec.length - num); tf >>= 1; }
  if (flags & 1) num += (rec[rec.length - num - 1] & 3) + 1;
  return num;
}
function parseMobi(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  const nRec = dv.getUint16(76);
  if (nRec < 2 || String.fromCharCode(...u8.slice(60, 68)) !== 'BOOKMOBI' && String.fromCharCode(...u8.slice(60, 68)) !== 'TEXtREAd') throw new Error('这不是有效的 mobi/azw3 文件');
  const off = i => dv.getUint32(78 + i * 8);
  const rec = i => u8.subarray(off(i), i + 1 < nRec ? off(i + 1) : u8.length);
  const r0 = rec(0), d0 = new DataView(r0.buffer, r0.byteOffset, r0.byteLength);
  const comp = d0.getUint16(0), count = d0.getUint16(8), crypt = d0.getUint16(12);
  if (crypt !== 0) throw new Error('这本书有 DRM 加密，无法读取。请使用没有 DRM 的版本。');
  if (comp !== 1 && comp !== 2) throw new Error('这本书使用了暂不支持的压缩方式，请用 Calibre 转成 epub 后再导入。');
  const enc = r0.length > 32 ? d0.getUint32(28) : 1252;
  const extra = (r0.length > 0xf4 && d0.getUint32(20) >= 228) ? d0.getUint16(0xf2) : 0;
  const parts = [];
  for (let i = 1; i <= count && i < nRec; i++) {
    let r = rec(i);
    if (extra) r = r.subarray(0, r.length - mobiTrailingSize(r, extra));
    parts.push(comp === 2 ? palmDecompress(r) : r);
  }
  let total = 0; parts.forEach(a => total += a.length);
  const all = new Uint8Array(total); let o = 0; parts.forEach(a => { all.set(a, o); o += a.length; });
  const html = new TextDecoder(enc === 65001 ? 'utf-8' : 'windows-1252').decode(all);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,br,tr').forEach(el => el.append(' \n'));
  const text = (doc.body ? doc.body.textContent : html).replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  if (text.length < 20) throw new Error('没有从这个文件里读出文字');
  return text;
}

const TOC_CHAPTER_RE = new RegExp('^(chapter|part|book)\\s+(' + CHAPTER_WORD + ')\\b', 'i');
function buildTextToc(sentences, startIdx) {
  const heads = [];
  for (let i = startIdx || 0; i < sentences.length; i++) if (TOC_CHAPTER_RE.test(sentences[i].trim())) heads.push(i);
  const items = [];
  if (heads.length >= 2) {
    if (heads[0] > 0) items.push({ n: 0, t: '开头（书名、版权、目录等）', s: 0, e: 1 });
    heads.forEach((s, k) => items.push({ n: k + 1, t: sentences[s].trim().slice(0, 40), s, e: 1 }));
    return { kind: 'chapter', items };
  }
  const STEP = 50;
  for (let a = 0, k = 1; a < sentences.length; a += STEP, k++) items.push({ n: k, t: '第 ' + (a + 1) + '–' + Math.min(a + STEP, sentences.length) + ' 句', s: a, e: 1 });
  return { kind: 'segment', items };
}
function getToc() {
  if (!state) return { kind: 'segment', items: [] };
  if (!state.toc || !state.toc.items || !state.toc.items.length) { state.toc = buildTextToc(state.sentences, detectStart(state.sentences)); saveState(); }
  return state.toc;
}

}

function pgRowHtml(idx) {
  const cur = idx === state.idx;
  return '<div id="pgs-' + idx + '" style="display:flex;gap:10px;align-items:flex-start;padding:10px ' + (cur ? '8px' : '0') + ';border-bottom:1px solid var(--line);' + (cur ? 'background:var(--pop);border-radius:10px' : '') + '">' +
    '<button class="pgplay" onclick="pgSpeak(' + idx + ')" aria-label="朗读这一句" title="朗读这一句">▶</button>' +
    '<div style="flex:1;min-width:0">' +
      '<div class="pgsent" style="font-size:17px;line-height:1.6">' + pgWordsHtml(idx) + '</div>' +
      (getShowZh() ? '<div class="zh" id="pgz-' + idx + '" style="margin-top:4px;font-size:14px">' + pgTransHtml(idx) + '</div>' : '') +
    '</div>' +
    '<button class="link" style="flex-shrink:0;margin-top:6px" onclick="pgGo(' + idx + ')">精读</button>' +
    '</div>';
}
/* 点读：点一句就读这一句（优先用语音包里的自然语音） */
let pgPlayJob = 0, pgCurIdx = -1, pgHlTimer = null, pgHlK = -1;
/* 整页里读一句时，念到哪个词，哪个词就亮起来（和主界面一样） */
function pgTokPos(text) {
  const out = []; let pos = 0;
  String(text).split(/(\s+)/).forEach(tok => { const st = pos; pos += tok.length; if (!tok || /^\s+$/.test(tok) || !/[A-Za-z]/.test(tok)) return; out.push({ start: st, end: st + tok.length }); });
  return out;
}
function pgHlSet(idx, k) {
  if (k === pgHlK) return; pgHlK = k;
  document.querySelectorAll('.pgsent .w.speaking').forEach(e => e.classList.remove('speaking'));
  if (k < 0) return;
  const el = document.querySelector('#pgs-' + idx + ' .w[data-k="' + k + '"]'); if (el) el.classList.add('speaking');
}
function pgHlStop() { if (pgHlTimer) { clearInterval(pgHlTimer); pgHlTimer = null; } pgHlSet(0, -1); }
function pgMark(idx) {
  document.querySelectorAll('.pgon').forEach(e => e.classList.remove('pgon'));
  document.querySelectorAll('.pgplay').forEach(e => { e.textContent = '▶'; });
  pgCurIdx = idx;
  if (idx >= 0) { const pb = document.querySelector('#pgs-' + idx + ' .pgplay'); if (pb) pb.textContent = '■'; }
  const r = idx >= 0 ? document.getElementById('pgs-' + idx) : null;
  if (r) { r.classList.add('pgon'); try { r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }
}
async function pgGetBlob(text) {
  const pk = vpCount > 0 ? await vpGet(text) : null;
  if (pk) return pk;
  if (azReady()) return (await azLoad(text, azCfg().voice)).blob;
  return null;
}
function pgPlayOne(idx, job) {
  return new Promise(async res => {
    const text = state.sentences[idx], pos = pgTokPos(text); let blob = null;
    try { blob = await pgGetBlob(text); } catch (e) {}
    if (job !== pgPlayJob) return res(false);
    pgHlStop();
    if (blob) {
      const a = azSetSrc(blob); const starts = tokStarts(text, pos);
      a.onended = () => { pgHlStop(); res(true); }; a.onerror = () => { pgHlStop(); res(true); };
      a.play().then(() => {
        if (job !== pgPlayJob) return;
        pgHlTimer = setInterval(() => {
          if (job !== pgPlayJob) { pgHlStop(); return; }
          if (a.paused || !a.duration) return;
          const f = a.currentTime / a.duration; let k = -1;
          for (let i = 0; i < starts.length; i++) { if (starts[i] <= f) k = i; else break; }
          if (k >= 0) pgHlSet(idx, k);
        }, 60);
      }).catch(() => res(true));
    } else {
      try {
        const u = new SpeechSynthesisUtterance(text); applyVoiceSync(u); u.rate = getRate();
        const rate = u.rate || 1, cps = 15 * rate;
        const st = pos.map(p => { const before = text.slice(0, p.start); return before.length / cps + ((before.match(/[,;:]/g) || []).length * 0.22 + (before.match(/[.!?]/g) || []).length * 0.45) / Math.max(0.5, rate); });
        let got = false, t0 = 0;
        u.onstart = () => {
          t0 = performance.now();
          pgHlTimer = setInterval(() => {
            if (job !== pgPlayJob) { pgHlStop(); return; }
            if (got) return;
            const el = (performance.now() - t0) / 1000; if (el < 0.7) return;     // 先看这个声音会不会报告“念到哪个词”
            let k = -1; for (let i = 0; i < st.length; i++) { if (st[i] <= el) k = i; else break; }
            if (k >= 0) pgHlSet(idx, k);
          }, 80);
        };
        u.onboundary = ev => {
          if (job !== pgPlayJob || (ev.name && ev.name !== 'word')) return;
          got = true;
          let k = pos.findIndex(p => ev.charIndex >= p.start && ev.charIndex < p.end); if (k < 0) k = pos.findIndex(p => p.start >= ev.charIndex);
          if (k >= 0) pgHlSet(idx, k);
        };
        u.onend = u.onerror = () => { pgHlStop(); res(true); };
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch (e) { res(true); }
    }
  });
}
function pgPlayStop() {
  pgPlayJob++; pgHlStop();
  try { markStopped(); speechSynthesis.cancel(); } catch (e) {}
  pgMark(-1);
}
function pgSpeak(idx) {
  if (pgCurIdx === idx) { closeWordPop(); pgPlayStop(); return; }          // 正在读这一句时再点 ▶ = 停止
  closeWordPop(); pgPlayStop(); azUnlock();                // 必须在点击的这一下里同步执行（iPhone/iPad 的要求）
  const job = ++pgPlayJob; pgMark(idx);
  pgPlayOne(idx, job).then(() => { if (job === pgPlayJob) pgMark(-1); });
}
function pgCancel() { pgJobId++; pgRunning = false; }
function pgGo(idx) { pgCancel(); stopSpeech(); state.idx = idx; saveState(); closePop(); loadCurrent(); }
function pgNeedsTranslate(s, e) {
  if (!getShowZh()) return false;
  for (let i = s; i < e; i++) { if (!bookZh(i) && !(state.cache[i] && state.cache[i].translation)) return true; }
  return false;
}
function openPageView(ci) {
  if (!state) return;
  const toc = getToc();
  if (ci == null) ci = tocIndexFor(state.idx);
  if (ci < 0) ci = 0;
  ci = Math.max(0, Math.min(ci, toc.items.length - 1));
  const [s, e] = tocRange(ci);
  pgCancel(); pgPlayStop();                      // 换页时先停掉上一页还没翻完的任务和正在播放的声音
  pgCi = ci; pgS = s; pgE = e;
  const it = toc.items[ci];
  let html = '<h3 style="margin:0 0 4px">📄 整页翻译</h3>';
  html += '<div class="note" style="margin-bottom:8px">' + esc(pgItemLabel(it, toc)) + (e > s ? '（共 ' + (e - s) + ' 句）' : '') + '。点句首的 ▶ 朗读整句，点单词直接发音并查词，点“精读”回到主界面读这一句。</div>';
  html += '<div class="row" style="margin-bottom:6px">' +
    '<button class="ghost sm" ' + (ci > 0 ? 'onclick="openPageView(' + (ci - 1) + ')"' : 'disabled') + '>◀ 上一页</button>' +
    '<button class="ghost sm" ' + (ci < toc.items.length - 1 ? 'onclick="openPageView(' + (ci + 1) + ')"' : 'disabled') + '>下一页 ▶</button>' +
    (pgNeedsTranslate(s, e) ? '<button id="pgTransBtn" onclick="pgStartTranslate()">🌐 翻译整页</button>' : '') +
    '</div>';
  html += '<div id="pgProgress" class="note" style="min-height:18px"></div>';
  if (e <= s) html += '<div class="note">这一页没有可显示的文字（可能只有图片或中文）。</div>';
  else { html += '<div>'; for (let i = s; i < e; i++) html += pgRowHtml(i); html += '</div>'; }
  showPop(html);
  const cur = document.getElementById('pgs-' + state.idx);
  if (cur) setTimeout(() => cur.scrollIntoView({ block: 'center' }), 60);
  // 打开就自动翻译这一页（不用再点“翻译整页”）：句子特别多的页（>150 句）仍然让你自己点，免得一下子用光免费额度
  if (e > s && pgNeedsTranslate(s, e)) {
    const prog = document.getElementById('pgProgress');
    if (!navigator.onLine) { if (prog) prog.textContent = '当前离线，整页翻译需要联网。'; }
    else if (e - s > 150) { if (prog) prog.textContent = '这一页有 ' + (e - s) + ' 句，点上面的“翻译整页”开始翻译。'; }
    else pgStartTranslate(true);
  }
}
async function pgStartTranslate(auto) {
  if (pgRunning) { pgCancel(); const b = document.getElementById('pgTransBtn'); if (b) b.textContent = '🌐 翻译整页'; return; }   // 再点一下 = 停止
  const s = pgS, e = pgE, count = e - s;
  if (!auto && count > 150 && !confirm('这一页有 ' + count + ' 句，翻译可能需要几分钟，确定要继续吗？')) return;
  const my = ++pgJobId; pgRunning = true;
  const btn = document.getElementById('pgTransBtn'); if (btn) btn.textContent = '⏹ 停止翻译';
  let done = 0, total = 0, fails = 0, lastErr = '';
  for (let i = s; i < e; i++) if (!bookZh(i) && !(state.cache[i] && state.cache[i].translation)) total++;
  const setProg = () => { const p = document.getElementById('pgProgress'); if (p) p.textContent = total ? '已翻译 ' + done + ' / ' + total + ' 句…' : ''; };
  setProg();
  for (let i = s; i < e; i++) {
    if (pgJobId !== my) return;
    if (bookZh(i) || (state.cache[i] && state.cache[i].translation)) continue;
    try { state.cache[i] = { translation: await translateText(state.sentences[i], { bulk: true }) }; fails = 0; }
    catch (err) { state.cache[i] = { failed: true, err: err.message }; fails++; lastErr = err.message; }
    if (pgJobId !== my) return;
    saveState(); done++; setProg();
    const z = document.getElementById('pgz-' + i); if (z) z.innerHTML = pgTransHtml(i);
    if (fails >= 3) {                                            // 连续失败 3 句：多半是网络或翻译服务的问题，别一句句傻等超时
      pgRunning = false;
      const b = document.getElementById('pgTransBtn'); if (b) b.textContent = '🌐 重试翻译';
      const p = document.getElementById('pgProgress'); if (p) p.textContent = '翻译服务暂时连不上（' + lastErr + '），已停止。稍后点“重试翻译”。';
      return;
    }
  }
  pgRunning = false;
  if (pgJobId === my) { const b = document.getElementById('pgTransBtn'); if (b) b.remove(); const p = document.getElementById('pgProgress'); if (p) p.textContent = '整页翻译完成。'; }
}

/* ---------- 界面 ---------- */
function render() {
  closeWordPop();
  const app = document.getElementById('app');
  const header = '<div class="topbar"><div class="tbin"><div>' + (state ? '<button class="iconbtn" aria-label="回书架" onclick="closeBook()" style="font-size:15px;margin-left:-8px">‹ 书架</button>' : '<h1>一句一句读</h1>') + '</div>' +
    '<div class="tools">' + (state ? '<button class="iconbtn" aria-label="整页翻译" onclick="openPageView()">整页翻译</button><button class="iconbtn" aria-label="目录" onclick="openToc()">目录</button>' : '') + '<button class="iconbtn" aria-label="更多" onclick="openMoreMenu()" style="font-size:22px;letter-spacing:1px;padding-bottom:6px">···</button></div></div></div>';

  if (!state) {
    app.innerHTML = header + shelfHtml() +
      '<div class="note" style="margin:16px 4px 0">点单词查词、语法讲解、跟读录音都可以离线使用。整句翻译需要联网。' +
      (dictInfo && dictInfo.count ? '离线大词典已就绪（' + dictInfo.count.toLocaleString() + ' 词条）。' : '离线大词典会在联网时自动后台下载，也可在右上角“···”菜单里查看进度。') + '</div>';
    return;
  }
  if (state.idx >= state.sentences.length) {
    app.innerHTML = header + '<div class="card finish"><div style="font-size:40px">🎉</div><h2>整本书读完了！</h2><div class="sub">共 ' + state.sentences.length + ' 句。</div><button style="margin-top:16px" onclick="closeBook()">回书架</button></div>';
    return;
  }
  const lvl = levelInfo(), pct = Math.round(state.idx / state.sentences.length * 100);
  const c = state.cache[String(state.idx)];

  const bz = bookZh(state.idx), hasBz = !!(state.zh && state.zh[state.idx]);
  let trans;
  if (bz) trans = esc(bz);
  else if (c && c.translation) trans = esc(c.translation);
  else if (c && c.failed) trans = '整句翻译失败：' + esc(c.err) + ' <button class="link" onclick="retryTranslate()">重试</button>';
  else if (!navigator.onLine) trans = '当前离线，整句翻译需要联网。点单词查词和下面的语法讲解可以正常使用。';
  else trans = '正在翻译…<span style="color:var(--sub);font-size:.85em">（免费翻译偶尔较慢，请稍等）</span>';

  const ga = getAnalysis();
  const gHtml = '<details class="section" ' + (gramOpen ? 'open' : '') + ' ontoggle="gramOpen=this.open"><summary>语法讲解（离线）</summary>' +
    (ga.summary ? '<div class="gsum">' + esc(ga.summary) + '</div>' : '') +
    ga.items.map(it => '<div class="gi"><div class="gt">' + esc(it.title) + '</div>' +
      (it.hit ? '<div class="gh">“' + esc(it.hit) + '”</div>' : '') +
      '<div class="gd">' + esc(it.detail) + '</div>' +
      (EG.REF[it.key] ? '<button class="link" onclick="openGrammarDict(\'' + it.key + '\')">在语法字典中查看</button>' : '') + '</div>').join('') +
    '<div class="note" style="margin-top:6px">语法讲解由规则自动分析，适合作为读句子的提示；遇到复杂长句时仅供参考。</div></details>';

  const recs = (recView.key === recKey() && recView.urls.length)
    ? '<div class="note" style="margin-top:10px">我的录音（最近 3 次，先听原音再听自己的，对比发音）：</div>' +
      recView.urls.map((u, i) => '<div class="recitem"><span>' + (i === 0 ? '最新' : '第 ' + (i + 1) + ' 条') + '</span><audio controls preload="metadata" src="' + u.url + '"></audio></div>').join('') +
      '<button class="link" onclick="deleteRecs()">删除这句的录音</button>'
    : '<div class="note" style="margin-top:10px">点"跟读录音"录下自己的声音，读完点停止，录音保存在本机。</div>';

  // “更多练习”（听写 / 句子重组 / 跟读打分）已从界面撤下；功能代码还在，想恢复时把下面这行改回按钮即可
  const practiceHtml = '';


  app.innerHTML = header +
    '<div class="levelbar"><div><span class="badge">Lv.' + (lvl.idx + 1) + '</span> 对照美国 ' + lvl.label + ' 阶段</div><div>' + (tocLabel() ? esc(tocLabel()) : '') + '</div></div>' +
    '<div class="card">' +
      (function () { const r = imageRangeFor(state.idx); return (r && r[0] === curImageStart) ? curImageUrls.map(u => '<img src="' + u + '" alt="书页插图" style="max-width:100%;max-height:60vh;object-fit:contain;border-radius:10px;margin:0 auto 14px;display:block">').join('') : ''; })() +
      '<div class="sentence">' + renderSentenceHTML(state.sentences[state.idx]) + '</div>' +
      '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">' +
        '<div class="zh">' + (getShowZh() ? (bz ? '<span class="src" style="margin:0 6px 0 0">书中译文' + (state.zhp && state.zhp[state.idx] ? '·整段' : '') + '</span>' : '') + trans + (hasBz ? ' <button class="link" onclick="toggleBookZh()">' + (bz ? '改看机器翻译' : '改看书中译文') + '</button>' : '') : '<span class="sub">中文翻译已隐藏</span>') + '</div>' +
        '<button class="iconbtn" style="flex-shrink:0" onclick="toggleZh()">' + (getShowZh() ? '隐藏中文' : '显示中文') + '</button>' +
      '</div>' +
      '<div class="section">' +
        '<div class="row">' +
          '<button onclick="playListen()">' +
            (listenState.idx === state.idx && listenState.playing ? (listenState.paused ? '继续' : (azLoading ? '生成中…' : '暂停')) : '听原音') + '</button>' +
          voiceSelectHtml() +
          '<button class="ghost sm" onclick="cycleRate()">语速 ' + getRate() + 'x' + (rateIgnored[voiceKeyNow()] ? '（此声音不支持）' : '') + '</button>' +
          '<button class="recbtn ' + (rec.on ? 'on' : '') + '" onclick="toggleRecord()">' + (rec.on ? '停止录音 <span id="recTime">0.0 秒</span>' : '跟读录音') + '</button>' +
        '</div>' + recs + '</div>' +
      practiceHtml +
      gHtml +
    '</div>' +
    '<div class="bottombar"><div class="bbin">' +
      '<button class="ghost" onclick="prevSentence()" ' + (state.idx > 0 && !rec.on ? '' : 'disabled') + '>上一句</button>' +
      '<div class="bmid">第 ' + (state.idx + 1) + ' 句 · 共 ' + state.sentences.length + ' 句<div class="progressline" style="margin:6px 0 0"><div class="progressfill" style="width:' + pct + '%"></div></div></div>' +
      '<button class="nxt" onclick="nextSentence()" ' + (rec.on ? 'disabled' : '') + '>下一句</button>' +
    '</div></div>';
  applySpeakHighlight();
}
</script>
