<script>
'use strict';
let state = null, dictInfo = null, curTokens = [], curWord = '', curWordZh = '', gramOpen = true;
let analysisCache = { idx: -1, res: null }, simCache = { idx: -1, list: [] };
let rec = { mr: null, on: false, start: 0, timer: null };
let recView = { key: '', urls: [] };
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));

/* ---------- IndexedDB：离线大词典 + 录音 + 生词本 ---------- */
let _db = null;
function idb() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('sentence-reader', 3);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('dict')) d.createObjectStore('dict', { keyPath: 'w' });
      if (!d.objectStoreNames.contains('recs')) d.createObjectStore('recs');
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('vocab')) d.createObjectStore('vocab', { keyPath: 'word' });
      if (!d.objectStoreNames.contains('images')) d.createObjectStore('images');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _db;
}
async function idbGet(store, key) {
  const d = await idb();
  return new Promise((res, rej) => { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGetAll(store) {
  const d = await idb();
  return new Promise((res, rej) => { const r = d.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
}
async function idbPut(store, val, key) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); if (key === undefined) t.objectStore(store).put(val); else t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbPutMany(store, arr) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); const s = t.objectStore(store); arr.forEach(v => s.put(v)); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
}
async function idbClear(store) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).clear(); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbDel(store, key) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).delete(key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}

/* ---------- 启动与保存 ---------- */
async function boot() {
  try { const raw = localStorage.getItem('sr_state'); if (raw) state = JSON.parse(raw); } catch (e) {}
  if (state) {
    if (!state.bookId) state.bookId = 'b' + (state.startDate || Date.now());
    state.prog = state.prog || {}; state.cache = state.cache || {};
    delete state.wordCache;
  }
  try { dictInfo = (await idbGet('meta', 'dictInfo')) || null; } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (state) loadCurrent(); else render();
  if (!dictInfo || !dictInfo.count) autoImportDict();
}
window.addEventListener('online', () => { if (state) loadCurrent(); });
window.addEventListener('offline', () => render());
boot();

function saveState() {
  if (!state) { localStorage.removeItem('sr_state'); return; }
  try { localStorage.setItem('sr_state', JSON.stringify(state)); }
  catch (e) {
    const k = String(state.idx), keep = {};
    if (state.cache[k]) keep[k] = state.cache[k];
    state.cache = keep;
    try { localStorage.setItem('sr_state', JSON.stringify(state)); } catch (e2) {}
  }
}

/* ---------- 整句翻译（需联网，失败不影响学习） ---------- */
let lastTranslateAt = 0, googleBadUntil = 0;
async function throttleGap() {
  const gap = 700, wait = lastTranslateAt + gap - Date.now();
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastTranslateAt = Date.now();
}
async function fetchViaGoogle(q) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(q);
    const resp = await fetch(url, { signal: ctrl.signal });
    if (!resp.ok) { const err = new Error('google-' + resp.status); err.code = resp.status; throw err; }
    const data = await resp.json();
    const t = (data && data[0] || []).map(seg => seg && seg[0]).join('');
    if (!t) throw new Error('google-empty');
    return t;
  } finally { clearTimeout(timer); }
}
async function fetchViaMyMemory(q) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  let resp;
  try {
    resp = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=en|zh-CN', { signal: ctrl.signal });
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? '网络请求超时' : '网络请求失败');
  } finally { clearTimeout(timer); }
  if (resp.status === 429) { const err = new Error('翻译服务返回 429'); err.code = 429; throw err; }
  if (!resp.ok) throw new Error('翻译服务返回 ' + resp.status);
  const data = await resp.json();
  const t = data && data.responseData && data.responseData.translatedText;
  if (!t) throw new Error('没有返回翻译结果');
  if (/MYMEMORY WARNING|QUOTA/i.test(t)) throw new Error('今天的免费翻译额度已用完，明天会恢复');
  return t;
}
async function translateText(text) {
  const q = text.slice(0, 480);
  await throttleGap();
  // 主用：Google 免费接口，容量更大更稳定
  if (Date.now() > googleBadUntil) {
    try { return await fetchViaGoogle(q); } catch (e) { googleBadUntil = Date.now() + 10 * 60 * 1000; /* 失败就换下一个源，10 分钟内不再先试它 */ }
  }
  // 备用：MyMemory，遇到 429 自动重试几次
  const delays = [0, 1500, 3500];
  let lastErr;
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) await new Promise(r => setTimeout(r, delays[i]));
    await throttleGap();
    try { return await fetchViaMyMemory(q); }
    catch (e) { lastErr = e; if (e.code !== 429) throw e; }
  }
  throw lastErr || new Error('两个免费翻译源暂时都请求失败，请稍等一会儿再点重试');
}


/* ---------- 文本处理 ---------- */
function splitSentences(text) {
  text = text.replace(/\r/g, ' ').replace(/\s+/g, ' ').trim();
  // 中英对照书：只留英文。①括号里的中文注释整体去掉（如 hammer (锤子)）；②全角标点换成半角（如 ？→?，１８７９→1879）；
  // ③每一段中文都当作分隔符，这样英文段落之间即使没有句末标点，也不会被粘成一整句。
  text = text.replace(/[（(][^()（）A-Za-z]*[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff][^()（）A-Za-z]*[)）]/g, ' ');
  text = text.replace(/[\uff01-\uff5e]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  text = text.replace(/[\u2160-\u217f\u2460-\u24ff\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]+/g, ' \u2029 ');
  text = text.replace(/[ \t]+/g, ' ').trim();
  text = text.replace(/\b(Mr|Mrs|Ms|Dr|St|Jr|Sr|Prof|Mt|No)\./g, '$1\u2024');
  text = text.replace(/([a-z][.!?])(?=[“‘])/g, '$1 '); // 句号后面紧跟着左引号，补个空格才能断句
  text = text.replace(/([a-zA-Z])\.([A-Z])/g, '$1. $2'); // 修复类似 "I.Down"、"CHAPTER II.The" 这种缺空格的粘连
  return text.replace(/([.!?]+["'”’)\]]*)\s+/g, '$1\u2029').split('\u2029')
    .map(s => s.replace(/\u2024/g, '.').trim())
    .filter(s => s.length > 1 && /[A-Za-z]{2}/.test(s) && !/https?:\/\/|www\.|ISBN|©/i.test(s));
}
/* ---------- 中英对照：把书里自带的中文译文，和对应的英文句子配上对 ---------- */
const ANNOT_RE = /[（(][^()（）A-Za-z]*[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff][^()（）A-Za-z]*[)）]/g;
const ZH_KEEP = '\\u3000-\\u303f\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\u2160-\\u217f\\u2460-\\u24ff\\uff00-\\uffef';   // 含全角标点：中文译文按原样保留
const ZH_RUN_RE = new RegExp('[' + ZH_KEEP + '“‘](?:[' + ZH_KEEP + '\\s\\d,.;:!?"\'“”‘’()\\-·…—]*[' + ZH_KEEP + '”’])?', 'g');
const IDEO_RE = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;
// 把一页/一节文字切成按顺序排列的“英文段”和“中文段”。英文段里的句子照常切句；中文段先留着，后面配对用。
function parseBlockSegs(text) {
  let t = String(text || '').replace(/\r/g, ' ').replace(/\s+/g, ' ').trim();
  t = t.replace(ANNOT_RE, ' ');
  const raw = []; let last = 0, m;
  ZH_RUN_RE.lastIndex = 0;
  while ((m = ZH_RUN_RE.exec(t))) {
    if (!IDEO_RE.test(m[0])) continue;                    // 只有标点，不算中文
    if (m.index > last) raw.push({ lang: 'en', text: t.slice(last, m.index) });
    raw.push({ lang: 'zh', text: m[0] });
    last = m.index + m[0].length;
  }
  if (last < t.length) raw.push({ lang: 'en', text: t.slice(last) });
  const segs = [];                                         // 夹在两段中文之间的一小段英文（如人名 Hank）算作中文的一部分
  for (let i = 0; i < raw.length; i++) {
    const r = raw[i], prev = segs[segs.length - 1], nxt = raw[i + 1];
    if (r.lang === 'en' && prev && prev.lang === 'zh' && nxt && nxt.lang === 'zh' && r.text.trim().split(/\s+/).length <= 3 && !/[.!?]["”’)]*\s*$/.test(r.text)) { prev.text += r.text + nxt.text; i++; continue; }
    segs.push({ lang: r.lang, text: r.text });
  }
  const sentences = [], out = [];
  for (const sg of segs) {
    if (sg.lang === 'zh') { out.push({ lang: 'zh', text: sg.text }); continue; }
    if (!/[A-Za-z]/.test(sg.text)) continue;
    const ss = splitSentences(sg.text);
    if (ss.length) { out.push({ lang: 'en', n: ss.length }); sentences.push(...ss); }
  }
  return { sentences, segs: out };
}
function splitZh(t) {
  const parts = String(t).replace(/\s+/g, ' ').trim().match(/[^。！？!?]+[。！？!?]*[”’」』）)]*/g) || [];
  return parts.map(x => x.trim()).filter(x => IDEO_RE.test(x));
}
// 中文的章节标题（如“第一章 陌生人”）后面常常没有句号，会和第一句正文粘在一起：单独拆出来，才能和英文的标题句对上
const ZH_HEAD_RE = /^(第[一二三四五六七八九十百零〇\d]+[章节回幕部篇集](?:\s*[^\s。！？]{1,10}(?=\s))?)\s*/;
function fixZhHeading(zs, firstEn) {
  const m = zs.length ? zs[0].match(ZH_HEAD_RE) : null;
  if (!m) return zs;
  const head = m[1].trim(), rest = zs[0].slice(m[0].length).trim();
  if (!rest) return zs;
  return (TOC_CHAPTER_RE.test(String(firstEn || '').trim()) ? [head, rest] : [rest]).concat(zs.slice(1));   // 英文没有标题句时，中文标题不用
}

    else merged.push(sg.lang === 'en' ? { lang: 'en', idxs: sg.idxs.slice() } : { lang: 'zh', text: sg.text });

  let ez = 0, ze = 0;
  for (let i = 0; i + 1 < merged.length; i++) { if (merged[i].lang === 'en' && merged[i + 1].lang === 'zh') ez++; else if (merged[i].lang === 'zh' && merged[i + 1].lang === 'en') ze++; }

  let exact = 0, paraN = 0;

function stripGutenberg(text) {
  const startRe = /\*\*\*\s*START OF (?:THE|THIS) PROJECT GUTENBERG[^\n*]*\*\*\*/i;
  const endRe = /\*\*\*\s*END OF (?:THE|THIS) PROJECT GUTENBERG[^\n*]*\*\*\*/i;
  const sm = text.match(startRe);

  const em = text.match(endRe);
  if (em) text = text.slice(0, em.index);

}

async function importBookBlocks(blocks) {

    const pb = parseBlockSegs(block.text || '');
    const blockSentences = pb.sentences;
    { let off = sentences.length; for (const sg of pb.segs) { if (sg.lang === 'en') { allSegs.push({ lang: 'en', idxs: Array.from({ length: sg.n }, (_, k) => off + k) }); off += sg.n; } else allSegs.push(sg); } }
    const images = (block.images || []).slice(0, 3);

  }
  let next = Math.max(0, sentences.length - 1);          // 没有英文的页：指向它后面最近一页有英文的位置
  for (let k = tocItems.length - 1; k >= 0; k--) { if (tocItems[k].s < 0) tocItems[k].s = next; else next = tocItems[k].s; }
  let saveFailed = false;
  try { await Promise.all(saves); } catch (e) { saveFailed = true; }
  const al = hadCjk ? alignSegs(allSegs, sentences) : { zh: {}, para: {}, exact: 0, paraN: 0 };
  const unit = hasPage ? '页' : '节';
  const parts = ['读到 ' + sentences.length + ' 句英文（' + pagesWithText + '/' + blocks.length + ' ' + unit + '有英文）'];
  if (al.exact + al.paraN > 0) parts.push('书里自带的中文译文已对上 ' + (al.exact + al.paraN) + ' 句' + (al.paraN ? '（其中 ' + al.paraN + ' 句是整段译文）' : '') + '，这些句子不再机器翻译');

  parts.push(saveFailed ? '插图保存失败（可能是存储空间不足），只导入了文字'
    : totalImages ? '已提取 ' + totalImages + ' 张插图'
    : '没有找到可提取的插图');
  finalizeImport(sentences, saveFailed ? [] : imageRanges, bookId, parts.join('；'), { kind: hasPage ? 'page' : 'section', items: tocItems }, al);

/* ---------- 自动识别正文起点：跳过书名页、版权页、献词、目录等 ---------- */
const FRONT_MATTER_RE = /\b(copyright|all rights reserved|isbn|library of congress|published (by|in)|first published|printed in|no part of this|permission of the publisher|table of contents|^contents\b|dedicat|illustrat(ed|ions?)\s+by|pictures?\s+by|cover (design|art|illustration)|edited by|translated by|acknowledg|about the author|www\.\w|\.com\b|project gutenberg|this ebook is for the use of|almost no restrictions whatsoever|redistribut(e|ing) it|terms of the project gutenberg|^(prologue|preface|foreword)$)/i;
function looksLikeFrontMatter(s) {
  if (FRONT_MATTER_RE.test(s)) return true;
  if (/^ACTIVITIES\b|\b(Before|While|After) Reading\b/.test(s)) return true;
  const words = s.split(/\s+/).filter(Boolean);
  if (words.length < 2 && !/[.!?]["'”’)\]]*$/.test(s.trim())) return true;
  if (/^(to|for)\s+[A-Z][a-z]+[.,]?$/.test(s.trim()) && words.length <= 5) return true; // 献词，如 "To Emma."
  if (words.length <= 6) {
    const capRatio = words.filter(w => /^[A-Z]/.test(w)).length / words.length;
    if (capRatio >= 0.8 && !/[.!?]$/.test(s.trim())) return true; // 短且几乎全是大写开头、又没有句末标点，多半是标题/署名行
  }
  return false;
}
const CHAPTER_WORD = 'one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|\\d{1,3}|[ivxlcdm]{1,7}';
function isJunkSentence(s) {
  const t = s.trim();
  const words = t.split(/\s+/).filter(Boolean), n = words.length;
  if (!/[.!?]["'”’)\]]*$/.test(t)) return true;                 // 没有句末标点：多半是标题/署名/目录
  if (/https?:\/\/|www\.|ISBN|©/i.test(t)) return true;         // 网址、书号、版权符号
  if ((t.match(/\d/g) || []).length / t.length >= 0.1) return true; // 数字太多
  if (n >= 3 && !words.some(w => /^[a-z]/.test(w))) return true;   // 没有一个小写开头的词：全是专有名词/标题
  return false;
}
function detectStart(sentences) {
  let idx = detectStartBase(sentences);
  if (isJunkSentence(sentences[idx])) {
    const cap = Math.min(sentences.length, idx + 80);
    for (let j = idx; j < cap; j++) {
      if (!isJunkSentence(sentences[j]) && sentences[j].trim().split(/\s+/).length >= 4) { idx = j; break; }
    }
  }
  return idx;
}
function detectStartBase(sentences) {
  const N = Math.min(sentences.length, 100);
  const markerRe = new RegExp('\\bchapter\\s+(' + CHAPTER_WORD + ')\\b\\.?', 'i');
  const idxs = [];
  for (let i = 0; i < N; i++) { if (markerRe.test(sentences[i])) idxs.push(i); }
  // 如果开头密集出现好几个"CHAPTER X."，说明这是目录列表，而不是正文，整段跳过
  let searchFrom = 0;
  if (idxs.length >= 3 && idxs[0] <= 15) {
    let last = idxs[0];
    for (let k = 1; k < idxs.length; k++) {
      const idx = idxs[k], wc = sentences[idx].trim().split(/\s+/).length;
      if (idx - last <= 2 && wc <= 20) last = idx; else break;
    }
    if (last > idxs[0]) searchFrom = last + 1;
  }
  const startHeadingRe = new RegExp('^(chapter\\s+(' + CHAPTER_WORD + ')\\b\\.?|prologue\\b)', 'i');
  const M = Math.min(sentences.length, searchFrom + 60);
  for (let i = searchFrom; i < M; i++) {
    const trimmed = sentences[i].trim();
    if (startHeadingRe.test(trimmed)) {
      const wc = trimmed.split(/\s+/).length;
      return wc <= 6 ? Math.min(i + 1, sentences.length - 1) : i; // 短标题单独一句就跳过它；若和正文粘在一起，就从这句开始
    }
  }
  let i = searchFrom;
  const cap = Math.min(sentences.length, searchFrom + 40);
  while (i < cap && looksLikeFrontMatter(sentences[i])) i++;
  return Math.min(i, sentences.length - 1);
}
const NEED_READS = 3, NEED_LISTENS = 3;

/* ---------- 词序对比打分（听写 / 跟读打分共用） ---------- */
function normWords(s) { return (s.match(/[A-Za-z']+/g) || []).map(w => w.toLowerCase()); }
function lcsMatch(target, user) {
  const n = target.length, m = user.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    dp[i][j] = target[i - 1] === user[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  }
  let i = n, j = m; const matchedTarget = new Set(), matchedUser = new Set();
  while (i > 0 && j > 0) {
    if (target[i - 1] === user[j - 1]) { matchedTarget.add(i - 1); matchedUser.add(j - 1); i--; j--; }
    else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--;
  }
  return { matchedTarget, matchedUser, matchedCount: matchedTarget.size };
}
function scoreAgainst(targetSentence, userText) {
  const targetDisplay = targetSentence.match(/[A-Za-z']+/g) || [];
  const userDisplay = userText.match(/[A-Za-z']+/g) || [];
  const tN = normWords(targetSentence), uN = normWords(userText);
  const r = lcsMatch(tN, uN);
  const pct = tN.length ? Math.round(r.matchedCount / tN.length * 100) : 0;
  const userHtml = userDisplay.map((w, idx) => '<span style="color:' + (r.matchedUser.has(idx) ? 'var(--accent2)' : 'var(--rec)') + (r.matchedUser.has(idx) ? '' : ';text-decoration:line-through') + '">' + esc(w) + '</span>').join(' ') || '<span class="sub">（没有识别到内容）</span>';
  const missing = targetDisplay.filter((_, idx) => !r.matchedTarget.has(idx));
  return { pct, userHtml, missing, matchedCount: r.matchedCount, total: tN.length };
}

/* ---------- 句子重组小游戏 ---------- */
let jumbleState = { pool: [], answer: [], target: [] };
function openJumble() {
  const words = state.sentences[state.idx].split(/\s+/).filter(Boolean);
  jumbleState.target = words;
  let pool = words.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  if (pool.length > 1 && pool.join(' ') === words.join(' ')) { [pool[0], pool[1]] = [pool[1], pool[0]]; }
  jumbleState.pool = pool.map((w, i) => ({ w, id: i }));
  jumbleState.answer = [];
  renderJumble();
}
function renderJumble() {
  const chip = (item, inAnswer) => '<span onclick="' + (inAnswer ? 'jumbleRemove' : 'jumbleAdd') + '(' + item.id + ')" style="display:inline-block;margin:4px;padding:6px 10px;background:var(--pop);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:15px">' + esc(item.w) + '</span>';
  let html = '<div class="note">点击下面打乱的词语，按正确顺序把句子拼出来；点已拼好的词可以撤回。</div>';
  html += '<div style="min-height:46px;border:1px dashed var(--line);border-radius:8px;padding:6px;margin-top:10px">' + (jumbleState.answer.length ? jumbleState.answer.map(it => chip(it, true)).join('') : '<span class="sub">（你拼的句子会显示在这里）</span>') + '</div>';
  html += '<div style="margin-top:10px">' + jumbleState.pool.map(it => chip(it, false)).join('') + '</div>';
  html += '<div class="row" style="margin-top:14px"><button onclick="checkJumble()" ' + (jumbleState.pool.length ? 'disabled' : '') + '>检查</button><button class="ghost sm" onclick="openJumble()">重新打乱</button></div>';
  html += '<div id="jumbleResult"></div>';
  if (fsOpen()) setFullscreenBody(html); else showFullscreen('🔀 句子重组', html);
}
function jumbleAdd(id) {
  const idx = jumbleState.pool.findIndex(x => x.id === id);
  if (idx < 0) return;
  jumbleState.answer.push(jumbleState.pool[idx]);
  jumbleState.pool.splice(idx, 1);
  renderJumble();
}
function jumbleRemove(id) {
  const idx = jumbleState.answer.findIndex(x => x.id === id);
  if (idx < 0) return;
  jumbleState.pool.push(jumbleState.answer[idx]);
  jumbleState.answer.splice(idx, 1);
  renderJumble();
}
function checkJumble() {
  const userOrder = jumbleState.answer.map(x => x.w);
  const ok = userOrder.join(' ') === jumbleState.target.join(' ');
  let correctCount = 0;
  userOrder.forEach((w, i) => { if (w === jumbleState.target[i]) correctCount++; });
  const el = document.getElementById('jumbleResult');
  if (!el) return;
  el.innerHTML = ok
    ? '<div class="note" style="margin-top:10px;color:var(--accent2);font-weight:600">🎉 完全正确！</div>'
    : '<div class="note" style="margin-top:10px">还不完全对：' + correctCount + '/' + jumbleState.target.length + ' 个词位置正确。再试试，或点"重新打乱"。</div>';
}

async function dictLookup(w) {
  if (!dictInfo || !dictInfo.count) return null;
  try { return (await idbGet('dict', w)) || (await idbGet('dict', '^' + w)) || null; } catch (e) { return null; }
}
async function lookupWord(raw) {
  const cands = EG.lemmaCandidates(raw), results = [], seen = new Set(), extra = [];
  const tryOne = async c => {
    if (seen.has(c.w) || results.length >= 3) return;
    const e = await dictLookup(c.w);
    if (e) {
      seen.add(c.w);
      results.push({ head: e.w.replace(/^\^/, ''), p: e.p, t: e.t, d: e.d, note: c.note, src: '离线大词典' });
      const m = (e.x || '').match(/(?:^|\/)0:([^\/]+)/);
      if (m && m[1].toLowerCase() !== c.w) extra.push({ w: m[1].toLowerCase(), note: c.w + ' 的原形是 ' + m[1] });
      return;
    }
    const b = BASIC_DICT[c.w];
    if (b) { seen.add(c.w); results.push({ head: c.w, t: b, note: c.note, src: '内置词典' }); }
  };
  for (const c of cands) { if (c.r && results.length) continue; await tryOne(c); }
  for (const c of extra) await tryOne(c);
  if (!results.length && navigator.onLine && cands.length) {
    try { results.push({ head: cands[0].w, t: await translateText(cands[0].w), src: '在线翻译' }); } catch (e) {}
  }
  return results;
}
function positionWordPop(rect) {

  const spaceBelow = vh - rect.bottom, spaceAbove = rect.top;

  else { top = rect.top - ph - 12; cls = 'above'; }
  top = Math.max(8, Math.min(top, vh - ph - 8));

  const arrowLeft = Math.max(14, Math.min(rect.left + rect.width / 2 - left - 6, pw - 26));
  pop.querySelector('.wp-arrow').style.left = arrowLeft + 'px';

// ECDICT 完整版有 76 万词条，其中大量是生僻词和专有名词。只保留常用词（词频前 6 万，或带考试/柯林斯/牛津标记的），体积小很多。
function ecKeep(r) {
  const frq = parseInt(r.frq, 10) || 0, bnc = parseInt(r.bnc, 10) || 0;
  const rank = Math.min(frq || 1e9, bnc || 1e9);
  const flagged = (parseInt(r.collins, 10) || 0) > 0 || String(r.oxford || '').trim() === '1' || String(r.tag || '').trim() !== '';
  return rank <= 60000 || flagged;
}
async function parseDictBlob(blob, name, onProgress) {
  if (!window.Papa) throw new Error('导入组件没有加载成功，请联网刷新页面后再试');
  const head = await blob.slice(0, 4096).text();
  const firstLine = head.split(/\r?\n/)[0].toLowerCase();
  const isEcdict = firstLine.includes('word') && firstLine.includes('translation');
  const isTsv = !isEcdict && firstLine.includes('\t');
  await idbClear('dict');
  await idbPut('meta', null, 'dictInfo');
  dictInfo = null;
  let count = 0, pending = Promise.resolve();
  await new Promise((resolve, reject) => {
    Papa.parse(blob, {
      header: isEcdict,
      delimiter: isTsv ? '\t' : '',
      skipEmptyLines: true,
      chunkSize: 2 * 1024 * 1024,
      chunk: (results, parser) => {
        parser.pause();
        const items = [];
        for (const r of results.data) {
          let w, t, p = '', d = '', x = '';
          if (isEcdict) { if (!ecKeep(r)) continue; w = r.word; t = r.translation; p = r.phonetic || ''; d = r.definition || ''; x = r.exchange || ''; }
          else { w = r[0]; t = (r.slice(1) || []).join(' '); }
          if (!w) continue;
          w = String(w).trim();
          if (!w || w.indexOf(' ') >= 0 || w.length > 40) continue;
          t = String(t || '').replace(/\\n/g, '\n').trim();
          d = String(d || '').replace(/\\n/g, '\n').trim();
          if (!t && !d) continue;
          const low = w.toLowerCase();
          items.push({ w: (w === low ? low : '^' + low), t, p, d: d.slice(0, 400), x });
        }
        count += items.length;
        pending = idbPutMany('dict', items).then(() => {
          if (onProgress) onProgress(count, 100 * (results.meta.cursor || 0) / blob.size);
          parser.resume();
        }).catch(err => { parser.abort(); reject(err); });
      },
      complete: () => { pending.then(resolve, reject); },
      error: err => reject(err)
    });
  });
  if (!count) throw new Error('没有读到任何词条，文件格式可能不对');
  dictInfo = { count, name, at: Date.now() };
  await idbPut('meta', dictInfo, 'dictInfo');
  return count;
}

async function readMaybeGzip(resp) {
  const buf = await resp.arrayBuffer();

  if (u8.length > 2 && u8[0] === 0x1f && u8[1] === 0x8b) {
    if (typeof DecompressionStream === 'undefined') throw new Error('浏览器版本太旧，不支持解压词典文件');
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

async function importSlimText(text, name) {
  await idbClear('dict'); await idbPut('meta', null, 'dictInfo'); dictInfo = null;
  let count = 0, batch = [];

    if (!line) continue;
    const f = line.split('\t');
    if (f.length < 3 || !f[0]) continue;
    batch.push({ w: f[0], p: f[1] || '', t: (f[2] || '').replace(/\\n/g, '\n'), d: '', x: f[3] || '' });
    if (batch.length >= 5000) { await idbPutMany('dict', batch); count += batch.length; batch = []; }
  }
  if (batch.length) { await idbPutMany('dict', batch); count += batch.length; }
  if (!count) throw new Error('词典文件是空的或格式不对');
  dictInfo = { count, name, at: Date.now() };
  await idbPut('meta', dictInfo, 'dictInfo');
  return count;
}

async function exportSlimDict() {

function readAsArrayBuffer(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsArrayBuffer(file); }); }
function readAsText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsText(file); }); }
function normalizeZipPath(p) {
  const parts = p.split('/'), out = [];
  for (const part of parts) { if (part === '.' || part === '') continue; if (part === '..') out.pop(); else out.push(part); }
  return out.join('/');

async function parseEpub(buf) {
  const zip = await JSZip.loadAsync(buf);
  const cf = zip.file('META-INF/container.xml');
  if (!cf) throw new Error('这不是有效的 epub 文件');
  const parser = new DOMParser();
  const cdoc = parser.parseFromString(await cf.async('string'), 'application/xml');
  const opfPath = cdoc.querySelector('rootfile').getAttribute('full-path');
  const opfDir = opfPath.includes('/') ? opfPath.split('/').slice(0, -1).join('/') : '';
  const odoc = parser.parseFromString(await zip.file(opfPath).async('string'), 'application/xml');
  const manifest = {};
  odoc.querySelectorAll('manifest > item').forEach(it => { manifest[it.getAttribute('id')] = it.getAttribute('href'); });
  const blocks = [];
  for (const it of odoc.querySelectorAll('spine > itemref')) {
    const href = manifest[it.getAttribute('idref')]; if (!href) continue;
    const path = opfDir ? opfDir + '/' + href : href;
    const f = zip.file(path) || zip.file(decodeURIComponent(path)); if (!f) continue;
    const doc = parser.parseFromString(await f.async('string'), 'text/html');
    const fileDir = path.includes('/') ? path.split('/').slice(0, -1).join('/') : '';
    const images = [];
    const imgEls = doc.querySelectorAll('img, image');
    for (const img of imgEls) {
      let src = img.getAttribute('src') || img.getAttribute('xlink:href') || img.getAttribute('href');
      if (!src || /^(data:|https?:)/i.test(src)) continue;
      src = decodeURIComponent(src.split('#')[0]);
      const imgPath = normalizeZipPath(src.startsWith('/') ? src.slice(1) : (fileDir ? fileDir + '/' + src : src));
      const imgFile = zip.file(imgPath) || zip.file(decodeURIComponent(imgPath));
      if (!imgFile) continue;
      try {
        const raw = await imgFile.async('blob');
        const ext = (imgPath.split('.').pop() || '').toLowerCase();
        const mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' }[ext] || raw.type || 'image/jpeg';
        if (raw.size > 1500) images.push(new Blob([raw], { type: mime }));
      } catch (e) {}
    }
    const hEl = doc.querySelector('h1,h2,h3');
    const title = hEl ? hEl.textContent.replace(/\s+/g, ' ').trim().slice(0, 60) : '';
    doc.querySelectorAll('p,div,h1,h2,h3,h4,li,br').forEach(el => el.append(' \n'));
    const text = (doc.body ? doc.body.textContent : '').trim();
    if (text || images.length) blocks.push({ text, images, title });
  }
  return blocks;
}

      if (gap >= -h * 0.5 && gap <= h * 1.1 && overlap > minW * 0.25) { target = g; break; }

function bubbleText(g) {

function extractOcrWords(data) {
  const out = [];

function isGoodOcrWord(w) {
  const t = w.text, letters = letterCount(t);

  for (const w of ws) {
    const h = Math.max(1, w.y1 - w.y0);

    for (let i = lines.length - 1; i >= 0 && i >= lines.length - 30; i--) {
      const l = lines[i], lh = Math.max(1, l.y1 - l.y0);

  if (!idxs.length || !askOcr(idxs.length, blocks.length)) return blocks;

  let done = 0;
  for (const i of idxs) {
    if (ocrCancel) break;

    const texts = [];
    for (const img of blocks[i].images.slice(0, 3)) {
      try { const c = await blobToOcrCanvas(img); texts.push(await ocrCanvas(c)); c.width = c.height = 0; }

    if (letterCount(t) >= 3) blocks[i].text = t;

async function parsePdf(buf) {
  if (!window.pdfjsLib) throw new Error('PDF 组件没有加载成功，请联网刷新后再试');
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const n = pdf.numPages, texts = [];
  for (let i = 1; i <= n; i++) {
    setImportStatus('正在读取第 ' + i + '/' + n + ' 页的文字…');
    const content = await (await pdf.getPage(i)).getTextContent();
    texts.push(content.items.map(it => it.str).join(' '));
  }
  const hasCJK = t => /[\u3400-\u9fff]/.test(t);
  const usableLetters = t => splitSentences(t).filter(x => x.trim().split(/\s+/).length >= 4).reduce((m, x) => m + letterCount(x), 0);
  // 文字很少的页 = 文字多半画在图里；中英对照书里“有中文、几乎没有英文”的页，多半是英文画在图里
  const sparse = texts.map(t => letterCount(t) < 15 || (hasCJK(t) && usableLetters(t) < 40));
  const sparseCount = sparse.filter(Boolean).length;
  let doOcr = sparseCount > 0 && askOcr(sparseCount, n);
  ocrCancel = false;
  const blocks = []; let ocrDone = 0;
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i);
    let text = texts[i - 1], images = [];
    setImportStatus('正在处理第 ' + i + '/' + n + ' 页…');
    try {
      const viewport = page.getViewport({ scale: 1.3 });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.72));
      if (blob) images = [blob];
    } catch (e) {}
    if (doOcr && sparse[i - 1] && !ocrCancel) {
      ocrStatus('正在识别第 ' + i + '/' + n + ' 页的文字（已识别 ' + ocrDone + '/' + sparseCount + ' 页）…');
      try {
        const v1 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: Math.min(3, Math.max(1, 2200 / Math.max(v1.width, v1.height))) });
        const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        const t = await ocrCanvas(c); c.width = c.height = 0;
        if (letterCount(t) >= 3 && letterCount(t) > usableLetters(text)) text = t;   // 识别出的英文比原来的文字层多才替换
        ocrDone++;
      } catch (e) { if (e.fatal) { alert(e.message); doOcr = false; } }
    }
    blocks.push({ text, images, page: i });
  }
  await stopOcrWorker();
  return blocks;
}
async function importFromFile(ev) {

const TOC_CHAPTER_RE = new RegExp('^(chapter|part|book)\\s+(' + CHAPTER_WORD + ')\\b', 'i');
function buildTextToc(sentences, startIdx) {
  const heads = [];
  for (let i = startIdx || 0; i < sentences.length; i++) if (TOC_CHAPTER_RE.test(sentences[i].trim())) heads.push(i);
  const items = [];
  if (heads.length >= 2) {
    if (heads[0] > 0) items.push({ n: 0, t: '开头（书名、版权、目录等）', s: 0, e: 1 });
    heads.forEach((s, k) => items.push({ n: k + 1, t: sentences[s].trim().slice(0, 40), s, e: 1 }));
    return { kind: 'chapter', items };
  }
  const STEP = 50;
  for (let a = 0, k = 1; a < sentences.length; a += STEP, k++) items.push({ n: k, t: '第 ' + (a + 1) + '–' + Math.min(a + STEP, sentences.length) + ' 句', s: a, e: 1 });
  return { kind: 'segment', items };
}
function getToc() {
  if (!state) return { kind: 'segment', items: [] };
  if (!state.toc || !state.toc.items || !state.toc.items.length) { state.toc = buildTextToc(state.sentences, detectStart(state.sentences)); saveState(); }
  return state.toc;
}
function tocIndexFor(idx) {
  const items = getToc().items; let ci = -1;
  for (let i = 0; i < items.length; i++) { if (items[i].s <= idx) ci = i; else break; }
  return ci;
}
function tocLabel() {
  const toc = getToc(), ci = tocIndexFor(state.idx);
  if (ci < 0) return '';
  const it = toc.items[ci];
  if (toc.kind === 'page') return '第 ' + it.n + ' 页';
  if (toc.kind === 'chapter' || toc.kind === 'section') return (it.t || '').slice(0, 14);
  return '';
}
function openToc() {
  const toc = getToc(), items = toc.items, cur = tocIndexFor(state.idx);
  const inputStyle = 'width:110px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--pop);color:var(--ink);font-family:inherit';
  let html = '<h3 style="margin:0 0 6px">📑 目录</h3>';
  html += '<div class="note" style="margin-bottom:8px">点任意一项，直接跳到那里开始学习。' + (toc.kind === 'page' ? '灰色的页是没读到英文的（可能只有图片或中文）。' : toc.kind === 'segment' ? '这本书没有识别到章节标题，按每 50 句分段。' : '') + '</div>';
  if (toc.kind === 'page') html += '<div class="row" style="margin-bottom:10px"><input type="number" id="tocPage" min="1" placeholder="页码" style="' + inputStyle + '" onkeydown="if(event.key===\'Enter\')tocGoPage()"><button class="sm" onclick="tocGoPage()">跳到这一页</button></div>';
  items.forEach((it, i) => {
    const empty = !it.e, sent = it.e ? state.sentences[it.s] : '';
    const label = toc.kind === 'page' ? '第 ' + it.n + ' 页' : (it.t || '第 ' + it.n + ' 节');
    const sub = toc.kind === 'page' ? (empty ? '（没读到英文）' : (sent || '').slice(0, 46)) : (toc.kind === 'section' && !it.t ? (sent || '').slice(0, 46) : '');
    html += '<div ' + (i === cur ? 'id="tocCur" ' : '') + 'onclick="tocJump(' + i + ')" style="padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;' + (empty ? 'opacity:.5;' : '') + (i === cur ? 'background:var(--pop);border-radius:6px;' : '') + '"><b>' + esc(label) + '</b>' + (i === cur ? '　⬅ 当前' : '') + (sub ? '<div class="sub" style="margin-top:2px">' + esc(sub) + '</div>' : '') + '</div>';
  });

function tocJump(i) {

  stopSpeech();
  state.idx = Math.max(0, Math.min(it.s, state.sentences.length - 1));

function tocGoPage() {

  let i = items.findIndex(it => it.n === n);
  if (i < 0) i = items.findIndex(it => it.n > n);
  if (i < 0) { alert('没有这一页，最大页码是 ' + items[items.length - 1].n); return; }
  tocJump(i);

  if (!state) {
    app.innerHTML = header +
      '<div class="card"><textarea id="pasteBox" placeholder="在这里粘贴英文文本…"></textarea>' +
      '<div class="row" style="margin-top:12px"><button onclick="importFromBox()">用粘贴的文本开始</button>' +
      '<div class="filebtn"><button class="ghost" type="button" tabindex="-1">上传 .txt / .epub / .pdf</button><input type="file" accept=".txt,.epub,.pdf,.mobi" onchange="importFromFile(event)"></div></div>' +
      '<div id="importStatus" class="note"></div>' +
      '<div class="note" style="margin-top:8px">图画书/漫画也支持：会保留每页插图；如果英文是画在图里的，导入时会问你要不要用文字识别（OCR）把它读出来，然后一句一句读。</div>' +
      '<div class="note" style="margin-top:6px">点单词查词、语法讲解、跟读录音都可以离线使用。整句翻译需要联网。' +
      (dictInfo && dictInfo.count ? '离线大词典已就绪（' + dictInfo.count.toLocaleString() + ' 词条）。' : '离线大词典会在联网时自动后台下载，也可在右上角"词典"里查看进度或手动导入。') + '</div></div>';
    return;
  }
  if (state.idx >= state.sentences.length) {
    app.innerHTML = header + '<div class="card finish"><div style="font-size:40px">🎉</div><h2>整本书读完了！</h2><div class="sub">共 ' + state.sentences.length + ' 句。</div><button style="margin-top:16px" onclick="resetBook()">导入下一本书</button></div>';
    return;
  }
  const lvl = levelInfo(), pct = Math.round(state.idx / state.sentences.length * 100);
  const p = currentProg(), c = state.cache[String(state.idx)];

  const bz = bookZh(state.idx), hasBz = !!(state.zh && state.zh[state.idx]);
  let trans;
  if (bz) trans = esc(bz);
  else if (c && c.translation) trans = esc(c.translation);
  else if (c && c.failed) trans = '整句翻译失败：' + esc(c.err) + ' <button class="link" onclick="retryTranslate()">重试</button>';
  else if (!navigator.onLine) trans = '当前离线，整句翻译需要联网。点单词查词和下面的语法讲解可以正常使用。';
  else trans = '正在翻译…';

  const ga = getAnalysis();
  const gHtml = '<details class="section" ' + (gramOpen ? 'open' : '') + ' ontoggle="gramOpen=this.open"><summary>📘 语法讲解（离线）</summary>' +
    (ga.summary ? '<div class="gsum">' + esc(ga.summary) + '</div>' : '') +
    ga.items.map(it => '<div class="gi"><div class="gt">' + esc(it.title) + '</div>' +
      (it.hit ? '<div class="gh">“' + esc(it.hit) + '”</div>' : '') +
      '<div class="gd">' + esc(it.detail) + '</div>' +
      (EG.REF[it.key] ? '<button class="link" onclick="openGrammarDict(\'' + it.key + '\')">在语法字典中查看</button>' : '') + '</div>').join('') +
    '<div class="note" style="margin-top:6px">语法讲解由规则自动分析，适合作为读句子的提示；遇到复杂长句时仅供参考。</div></details>';

  const recs = (recView.key === recKey() && recView.urls.length)
    ? '<div class="note" style="margin-top:10px">我的录音（最近 3 次，先听原音再听自己的，对比发音）：</div>' +
      recView.urls.map((u, i) => '<div class="recitem"><span>' + (i === 0 ? '最新' : '第 ' + (i + 1) + ' 条') + '</span><audio controls preload="metadata" src="' + u.url + '"></audio></div>').join('') +
      '<button class="link" onclick="deleteRecs()">删除这句的录音</button>'
    : '<div class="note" style="margin-top:10px">点"跟读录音"录下自己的声音，读完点停止。每录一次计 1 遍朗读，录音保存在本机。</div>';

  const practiceHtml = '<div class="section"><h3>更多练习（不影响解锁下一句进度）</h3><div class="row">' +
    '<button class="ghost sm" onclick="openDictation()">✍️ 听写</button>' +
    '<button class="ghost sm" onclick="openJumble()">🔀 句子重组</button>' +
    '<button class="ghost sm" onclick="openSpeechScore()">🎯 跟读打分' + (speechRecoSupported() ? '' : '（需Chrome/Edge）') + '</button>' +
    '</div></div>';

  const sim = getSimilar();
  const simHtml = '<div class="section"><h3>书中相似句子</h3>' + (sim.length ? '<ul class="examples">' + sim.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '<div class="note">书中暂时没有用词相近的句子。</div>') + '</div>';

  app.innerHTML = header +
    '<div class="levelbar"><div><span class="badge">Lv.' + (lvl.idx + 1) + '</span> 美国 ' + lvl.label + ' 水平</div><div>' + (tocLabel() ? esc(tocLabel()) + ' · ' : '') + '第 ' + (state.idx + 1) + ' / ' + state.sentences.length + ' 句</div></div>' +
    '<div class="progressline"><div class="progressfill" style="width:' + pct + '%"></div></div>' +
    '<div class="navsticky"><div class="row">' +
      '<button class="ghost" style="flex:1" onclick="prevSentence()" ' + (state.idx > 0 && !rec.on ? '' : 'disabled') + '>◀ 上一句</button>' +
      '<button style="flex:2" onclick="nextSentence()" ' + (rec.on ? 'disabled' : '') + '>进入下一句 ▶</button>' +
    '</div></div>' +
    '<div class="row" style="margin-bottom:12px"><button class="ghost sm" onclick="openJumpModal()">跳转句子</button><button class="ghost sm" onclick="openAppendModal()">追加内容</button><button class="ghost sm" onclick="resetBook()">换一本书</button></div>' +
    '<div class="card">' +
      (function () { const r = imageRangeFor(state.idx); return (r && r[0] === curImageStart) ? curImageUrls.map(u => '<img src="' + u + '" alt="书页插图" style="max-width:100%;max-height:60vh;object-fit:contain;border-radius:10px;margin:0 auto 14px;display:block">').join('') : ''; })() +
      '<div class="sentence">' + renderSentenceHTML(state.sentences[state.idx]) + '</div>' +
      '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">' +
        '<div class="zh">' + (getShowZh() ? (bz ? '<span class="src" style="margin:0 6px 0 0">书中译文' + (state.zhp && state.zhp[state.idx] ? '·整段' : '') + '</span>' : '') + trans + (hasBz ? ' <button class="link" onclick="toggleBookZh()">' + (bz ? '改看机器翻译' : '改看书中译文') + '</button>' : '') : '<span class="sub">中文翻译已隐藏</span>') + '</div>' +
        '<button class="iconbtn" style="flex-shrink:0" onclick="toggleZh()">' + (getShowZh() ? '隐藏中文' : '显示中文') + '</button>' +
      '</div>' +
      '<div class="section"><div class="metrics">' +
        '<div class="metric"><div class="num">' + cntLabel(p.listens, NEED_LISTENS) + '</div><div class="lab">听原音（建议3遍）</div></div>' +
        '<div class="metric"><div class="num">' + cntLabel(p.reads, NEED_READS) + '</div><div class="lab">跟读（建议3遍）</div></div></div>' +
        '<div class="row">' +
          '<button onclick="playListen()">' +
            (listenState.idx === state.idx && listenState.playing ? (listenState.paused ? '▶️ 继续' : '⏸ 暂停') : '🔊 听原音') + '</button>' +
          '<button class="ghost sm" onclick="cycleRate()">语速 ' + getRate() + 'x</button>' +
          '<button class="recbtn ' + (rec.on ? 'on' : '') + '" onclick="toggleRecord()">' + (rec.on ? '⏹ 停止录音 <span id="recTime">0.0 秒</span>' : '🎙️ 跟读录音') + '</button>' +
        '</div>' + recs + '</div>' +
      practiceHtml +
      gHtml + simHtml +
    '</div>';
}
</script>
</body>
</html>
